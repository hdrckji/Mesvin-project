<script>
  /* Anti-flash : applique le thème choisi (localStorage 'graine.theme') AVANT
     le rendu, et fait suivre la couleur de barre du navigateur — même
     mécanique que les autres modules. */
  (function () {
    try {
      var choix = localStorage.getItem('graine.theme');
      if (choix === 'clair' || choix === 'sombre' || choix === 'sepia') {
        document.documentElement.setAttribute('data-theme', choix);
      }
      var fonds = { clair: '#f7f3ea', sombre: '#141b28', sepia: '#f2e6cf' };
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var maj = function () {
        var t = document.documentElement.getAttribute('data-theme') || (mq.matches ? 'sombre' : 'clair');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', fonds[t] || fonds.clair);
      };
      maj();
      if (mq.addEventListener) mq.addEventListener('change', maj);
    } catch (e) { /* stockage indisponible : on suit simplement le système */ }
  })();
</script>

/* ---------- Aides ---------- */
const el = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }

/* Reprise d'animation : la clé de l'animateur ne vit plus seulement dans

const ANIM_KEY = 'graine.frise.anim.v1';
function animEcrire(o) { try { localStorage.setItem(ANIM_KEY, JSON.stringify(o)); } catch (e) {} }

/* ---- Réseau : les points d'entrée dédiés /api/frise/* (sans compte) ---- */
async function api(chemin, corps) {
  const r = await fetch('../api/frise/' + chemin, corps === undefined ? {}
    : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(data.error || 'Le serveur a répondu ' + r.status + '.'); err.status = r.status; throw err; }
  return data;
}
/* Le vrai levier de difficulte : la PROXIMITE. En Decouverte, les cartes
   viennent de toute la fresque - de grands ecarts, placements evidents.
   Plus le niveau monte, plus elles sont tirees d'une FENETRE resserree de
   la chronologie, jusqu'a devoir ordonner des evenements (ou des livres)
   presque voisins. */
const NIVEAUX = { 1: 'Découverte', 2: 'Habitué', 3: 'Connaisseur' };
function tirageNiveau(base, n, niveau) {
  if (niveau <= 1 || base.length <= n + 2) return shuffle(base).slice(0, n);
  const tri = base.slice().sort((a, b) => a.ordre - b.ordre);
  const taille = Math.min(tri.length,
    niveau === 2 ? Math.max(n + 4, Math.round(n * 2.5)) : n + 2);
  const debut = Math.floor(Math.random() * (tri.length - taille + 1));
  return shuffle(tri.slice(debut, debut + taille)).slice(0, n);
}

    <p class="muted" style="font-size:.85rem;margin:8px 2px 0">${notes[config.niveau]}</p>`;
}

/* Le paquet au format serveur : la 1re carte est l'amorce, l'ordre du
   tableau est l'ordre de pioche (les deux adversaires reçoivent le même). */
function deckServeur(mode, portee, nb) {
  return tirageNiveau(paquet(mode, portee), nb + 1, config.niveau)
    .map(c => ({ t: c.titre, r: c.ref, o: c.ordre }));
}
function titrePaquet(mode, portee) {
  return mode === 'livres'
    ? "L'ordre des livres" + (portee === 'at' ? ' · Ancien Testament' : portee === 'nt' ? ' · Nouveau Testament' : ' · toute la Bible')
    : 'La frise des événements';
}

/* Construit le paquet d'une séance : chaque carte = { titre, ref?, ordre }. */
function paquet(mode, portee) {
  if (mode === 'livres') {
    const base = portee === 'at' ? LIVRES_AT : portee === 'nt' ? LIVRES_NT
      : LIVRES_AT.concat(LIVRES_NT);
    return base.map((titre, i) => ({ titre, ref: null, ordre: i }));
  }
  return EVENEMENTS.map(([titre, ref], i) => ({ titre, ref, ordre: i }));
}

/* Démarre une séance sur un paquet SERVI par le serveur (défi à distance) :
   même paquet, même ordre de pioche pour les deux adversaires. */
function demarrerServi(deckSrv, titre, enLigne) {
  const cartes = deckSrv.map(c => ({ titre: c.t, ref: c.r, ordre: c.o }));
  seance = {
    titre: titre, mode: null, portee: null, participants: null, tour: 0,
    enLigne: enLigne, envoye: false,
    placees: [cartes[0]], pioche: cartes.slice(1),
    courante: null, score: 0, total: cartes.length - 1, fb: null, revele: null,
  };
  piocher();
  ecran = 'seance';
  render();
}

function demarrer(mode, portee, noms) {
  const base = paquet(mode, portee);
  // À plusieurs : chacun place le même nombre de cartes (5, ou moins si le
  // paquet est petit) ; en solo, la séance classique de CARTES_PAR_SEANCE.
  const parTete = noms ? Math.max(3, Math.min(5, Math.floor((base.length - 1) / noms.length))) : 0;
  const total = noms ? parTete * noms.length : CARTES_PAR_SEANCE;
  const cartes = tirageNiveau(base, total + 1, config.niveau);
  const premiere = cartes[0]; // une carte déjà posée pour amorcer la frise
  seance = {
    titre: mode === 'livres'
      ? "L'ordre des livres" + (portee === 'at' ? ' · Ancien Testament' : portee === 'nt' ? ' · Nouveau Testament' : ' · toute la Bible')
      : 'La frise des événements',
    mode: mode, portee: portee,
    participants: noms ? noms.map(nom => ({ nom: nom, score: 0 })) : null,
    tour: 0,
    placees: [premiere],
    pioche: cartes.slice(1),
    courante: null, score: 0, total: cartes.length - 1,
    fb: null, revele: null,
  };
  piocher();
  ecran = 'seance';
  render();
}

function piocher() {
  seance.courante = seance.pioche.shift() || null;
  if (seance.courante === null) { ecran = 'fin'; }
}

/* L'utilisateur touche l'emplacement k (avant la carte posée d'index k). */
function placer(k) {
  const s = seance;
  if (s.revele) return; // le temps de lire le verdict, tout est figé
  const c = s.courante;
  const avantOk = k === 0 || s.placees[k - 1].ordre < c.ordre;
  const apresOk = k === s.placees.length || c.ordre < s.placees[k].ordre;
  const bon = avantOk && apresOk;
  // La carte rejoint TOUJOURS sa vraie place : la frise reste juste, et la
  // bonne position se voit (vert si trouvée, rouge si manquée).
  let vraie = s.placees.findIndex(p => p.ordre > c.ordre);
  if (vraie === -1) vraie = s.placees.length;
  s.placees.splice(vraie, 0, c);
  if (bon) {
    if (s.participants) s.participants[s.tour].score++; else s.score++;
    s.fb = { ok: true, texte: 'Bien placé !' };
  } else {
    const avant = vraie > 0 ? s.placees[vraie - 1] : null;
    const apres = vraie < s.placees.length - 1 ? s.placees[vraie + 1] : null;
    s.fb = { ok: false, texte: 'Pas là — ' + (avant && apres
      ? 'entre « ' + avant.titre + ' » et « ' + apres.titre + ' ».'
      : avant ? 'après « ' + avant.titre + ' ».' : 'avant « ' + apres.titre + ' ».') };
  }
  s.revele = { ordre: c.ordre, bon: bon };
  render();
  setTimeout(() => {
    if (!seance || seance !== s) return;
    s.revele = null;
    if (s.participants) s.tour = (s.tour + 1) % s.participants.length;
    piocher();
    render();
  }, bon ? 900 : 2400);
}

function quitter() { seance = null; online = null; pollArret(); ecran = 'accueil'; render(); }

/* La frise vue par l'animateur et les participants (cartes {t, r} déjà à
   leur place). En révélation, la carte du moment s'y glisse en vert/rouge. */
function htmlFriseEtat(etat, marquerBon) {
  const cartes = etat.frise.map(c => `<div class="fcarte"><span class="t">${esc(c.t)}</span>${c.r ? ` <span class="r">· ${esc(c.r)}</span>` : ''}</div>`);
  if (etat.phase === 'revele' && etat.enCours && etat.positionJuste !== null) {
    const cls = marquerBon === null ? 'bon' : marquerBon ? 'bon' : 'faux';
    cartes.splice(etat.positionJuste, 0,
      `<div class="fcarte ${cls}"><span class="t">${esc(etat.enCours.t)}</span>${etat.enCours.r ? ` <span class="r">· ${esc(etat.enCours.r)}</span>` : ''}</div>`);
  }
  return `<p class="sep">La frise — du plus ancien au plus récent</p>
    <div class="frise">${cartes.map(c => c + '<div style="height:8px"></div>').join('')}</div>`;
}

function vueAnim() {
  const o = online;
  const e = o.etat;
  if (!e) return `<div class="card center" style="padding:30px"><p class="muted" style="margin:0">Un instant…</p></div>`;
  const repondu = e.participants.filter(p => p.aRepondu).length;
  let controle = '';
  if (e.phase === 'attente') {
    controle = `<p class="muted">${e.participants.length} participant${e.participants.length > 1 ? 's' : ''} dans la salle — attends que tout le monde soit là.</p>
      <button class="btn btn-grow" data-avancer="1" ${e.participants.length === 0 ? 'disabled' : ''}>Lancer la première carte</button>`;
  } else if (e.phase === 'placement') {
    controle = `<p class="muted">${repondu} / ${e.participants.length} ont répondu.</p>
      <button class="btn btn-grow" data-avancer="1">Révéler</button>`;
  } else if (e.phase === 'revele') {
    controle = `<button class="btn btn-grow" data-avancer="1">${e.carte >= e.total ? 'Terminer la veillée' : 'Carte suivante'}</button>`;
  }
  const carte = e.enCours && e.phase !== 'fin'
    ? `<div class="acarte"><span class="lbl">Carte ${e.carte} / ${e.total}</span>
        <p class="titre">${esc(e.enCours.t)}</p>${e.enCours.r ? `<span class="r muted" style="font-size:.82rem">${esc(e.enCours.r)}</span>` : ''}</div>`
    : '';
  const participants = e.participants.length
    ? `<div class="pchips">${e.participants.map(p =>
        `<span class="pchip ${p.bon === true ? 'on' : ''}">${esc(p.prenom)} · ${p.score}${e.phase === 'placement' && p.aRepondu ? ' ✓' : ''}${p.bon === false ? ' ✗' : ''}</span>`).join('')}</div>`
    : '';
  const fin = e.phase === 'fin'
    ? `<div class="card fin"><p style="font-weight:650;margin:0 0 8px">La veillée est terminée 🌱</p>

    </div>
    ${participants}

function vuePart() {

  if (!e) return `<div class="card center" style="padding:30px"><p class="muted" style="margin:0">Un instant…</p></div>`;

  } else if (e.phase === 'placement' && e.enCours) {

    corps = `<p class="feedback ${moi.bon ? 'ok' : 'faux'}">${moi.bon ? 'Bien placé !' : moi.reponse === null ? "Tu n'avais pas répondu." : 'Pas là — la voici à sa place.'}</p>`

    corps = `<div class="card fin"><p style="font-weight:650;margin:0 0 8px">La veillée est terminée 🌱</p>

  return `<div class="fade">
    <div class="topline"><span>Veillée · ${esc(e.mode)} · <b>${moi.score}</b> pt${moi.score > 1 ? 's' : ''}</span>
      <button class="quit" data-quit="1">Quitter</button></div>
    ${corps}
  </div>`;
}

/* ---------- Écran de projection : la veillée vue par toute la salle ----------
   Lecture seule — il ne connaît que le CODE (ni clé, ni jeton) : l'état
   public suffit, et il ne contient jamais les cartes à venir. */
function vueProj() {
  const o = online;
  const e = o.etat;
  if (!e) return `<div class="card center" style="padding:40px;text-align:center"><p class="muted" style="margin:0">Un instant…</p></div>`;
  const repondu = e.participants.filter(p => p.aRepondu).length;

  const chips = (marquer) => e.participants.length
    ? `<div class="proj-chips">${e.participants.map(p =>
        `<span class="pchip ${marquer && p.bon === true ? 'on' : ''}${marquer && p.bon === false ? ' faux' : ''}">${esc(p.prenom)} · ${p.score}${!marquer && p.aRepondu ? ' ✓' : ''}${marquer && p.bon === true ? ' ✓' : ''}${marquer && p.bon === false ? ' ✗' : ''}</span>`).join('')}</div>`
    : '';

  const friseHtml = (avecEnCours) => {
    const cartes = e.frise.map(c => ({ t: c.t, r: c.r, cls: '' }));
    if (avecEnCours && e.enCours && e.positionJuste !== null) {
      cartes.splice(e.positionJuste, 0, { t: e.enCours.t, r: e.enCours.r, cls: ' bon' });
    }
    return `<p class="sep">La frise — du plus ancien au plus récent</p>
      <div class="proj-frise">${cartes.map((c, i) =>
        `<div class="fcarte${c.cls}"><span class="num">${i + 1}.</span><span class="t">${esc(c.t)}</span>${c.r ? ` <span class="r">· ${esc(c.r)}</span>` : ''}</div>`).join('')}</div>`;
  };

  if (e.phase === 'attente') {
    return `<div class="fade" style="padding-top:24px">
      <p class="proj-invite">Pour rejoindre : <b>biblehorizon.fr/frise</b> → « J'ai reçu un code »</p>
      <div class="proj-code">${esc(o.code)}</div>
      <p class="proj-etat" style="color:var(--ink-soft)">${e.participants.length === 0 ? 'La salle est ouverte — à vos téléphones !' : e.participants.length + ' déjà là — on attend les retardataires…'}</p>
      ${chips(false)}
    </div>`;
  }
  if (e.phase === 'placement') {
    return `<div class="fade">
      <p class="proj-invite" style="margin-top:8px">${esc(e.mode)} · code <b>${esc(o.code)}</b></p>
      <div class="proj-carte"><span class="lbl">Carte ${e.carte} / ${e.total} — où se place-t-elle ?</span>
        <p class="titre">${esc(e.enCours ? e.enCours.t : '')}</p></div>
      <p class="proj-etat">${repondu} / ${e.participants.length} ont répondu…</p>
      ${chips(false)}
      ${friseHtml(false)}
    </div>`;
  }
  if (e.phase === 'revele') {
    return `<div class="fade">
      <p class="proj-invite" style="margin-top:8px">${esc(e.mode)} · code <b>${esc(o.code)}</b></p>
      <div class="proj-carte"><span class="lbl">Carte ${e.carte} / ${e.total} — la voici à sa place</span>
        <p class="titre">${esc(e.enCours ? e.enCours.t : '')}</p>
        ${e.enCours && e.enCours.r ? `<span class="r">${esc(e.enCours.r)}</span>` : ''}</div>
      ${chips(true)}
      ${friseHtml(true)}
    </div>`;
  }
  // fin : le classement, bien en grand
  return `<div class="fade" style="padding-top:20px">
    <p class="proj-invite"><b>${esc(e.mode)}</b> — la veillée est terminée 🌱</p>
    <div class="card proj-classement">
      ${e.participants.map((p, i) => `<div class="frow ${i === 0 ? 'tete' : ''}"><span>${i + 1}. ${esc(p.prenom)}</span><b>${p.score} / ${e.total}</b></div>`).join('')}
    </div>
  </div>`;
}

/* ---- L'interrogation régulière du serveur (écrans en ligne) ---- */
function pollArret() { if (minuterie) { clearInterval(minuterie); minuterie = null; } }
function pollDemarre() {
  pollArret();
  minuterie = setInterval(async () => {
    try {
      if (ecran === 'dres' && online && !online.erreur) {
        const r = await api('duel/' + online.code);
        // on ne re-rend que si quelque chose a bougé (éviter de casser un tap)
        if (JSON.stringify(r) !== JSON.stringify(online.resultat)) { online.resultat = r; render(); }
        if (r.p1 && r.p2 && r.p1.score !== null && r.p2.score !== null) pollArret();
      } else if ((ecran === 'anim' || ecran === 'part' || ecran === 'proj') && online) {
        // garde-fou : si un clic (avancer, réponse) met l'état à jour pendant
        // que cette interrogation voyage, sa réponse — plus vieille — est jetée.
        const vAvant = online.v || 0;
        const q = ecran === 'anim' ? 'cle=' + online.cle : ecran === 'part' ? 'jeton=' + online.jeton : '';
        const e = await api('veillee/' + online.code + '/etat' + (q ? '?' + q : ''));
        if (online && (online.v || 0) === vAvant
            && JSON.stringify(e) !== JSON.stringify(online.etat)) { online.etat = e; render(); }
        if (online && online.cle && e && e.phase === 'fin') animOubli(); // veillée finie : plus rien à reprendre
      } else {
        pollArret();
      }
    } catch (err) {
      // 404 : la veillée n'existe plus (expirée, ou ménage passé) — on prévient
      // au lieu de laisser l'écran figé. Tout autre raté : on retentera.
      if (err && err.status === 404 && (ecran === 'anim' || ecran === 'part' || ecran === 'proj')) {
        pollArret();
        el.innerHTML = `<div class="fade" style="text-align:center;padding:48px 22px">`
          + `<p style="font-size:1.15rem;margin:0 0 6px">Cette veillée n'existe plus.</p>`
          + `<p class="muted" style="margin:0 0 22px">Elle a peut-être expiré — une veillée ne vit qu'un temps.</p>`
          + `<button class="btn btn-primary" data-perdu="1">Revenir au début</button></div>`;
        const b = el.querySelector('[data-perdu]');
        if (b) b.onclick = () => { location.href = './'; };
      }
    }
  }, 2500);
}

/* ---------- À plusieurs : préparation de la tablée ---------- */
function vueConfig() {
  const c = config;
  const decks = [
    ['evenements', 'tout', 'Les événements'],
    ['livres', 'tout', 'Livres · toute la Bible'],
    ['livres', 'at', 'Livres · Ancien T.'],
    ['livres', 'nt', 'Livres · Nouveau T.'],
  ];
  return `<div class="fade">
    <button class="quit" data-quit="1">‹ Retour</button>
    <h1 style="font-size:1.25rem;margin-top:10px">À plusieurs, ici</h1>
    <p class="muted" style="margin:4px 0 0">Chacun son tour : une carte, un choix, et la frise grandit pour tout le monde.</p>
    <div class="card">
      <p class="mode-title" style="margin-top:0">Le paquet</p>
      <div class="deckrow">${decks.map(([m, p, l]) =>
        `<button class="pill ${c.mode === m && c.portee === p ? 'on' : ''}" data-deck="${m}:${p}">${l}</button>`).join('')}</div>
      ${htmlNiveau()}
      <p class="mode-title" style="margin-top:16px">Les participants</p>
      ${c.noms.map((n, i) => `<input class="pin" data-nom="${i}" maxlength="14" placeholder="Prénom ${i + 1}" value="${esc(n)}">`).join('')}
      <div class="choix-row">
        <button class="btn btn-ghost" data-addp="1" ${c.noms.length >= 6 ? 'disabled' : ''}>+ Ajouter</button>
        <button class="btn btn-ghost" data-delp="1" ${c.noms.length <= 2 ? 'disabled' : ''}>− Retirer</button>
      </div>
      <button class="btn btn-grow" data-multistart="1">Commencer</button>
    </div>
  </div>`;
}

function vueSeance() {
  const s = seance;
  const faites = s.total - s.pioche.length - 1;
  const fb = s.fb
    ? `<p class="feedback ${s.fb.ok ? 'ok' : 'faux'}">${esc(s.fb.texte)}</p>`
    : `<p class="feedback"></p>`;
  const tablee = s.participants
    ? `<div class="pchips">${s.participants.map((p, i) =>
        `<span class="pchip ${i === s.tour ? 'on' : ''}">${esc(p.nom)} · ${p.score}</span>`).join('')}</div>`
    : '';
  const frise = [];
  for (let k = 0; k <= s.placees.length; k++) {
    if (!s.revele) frise.push(`<button class="slot" data-slot="${k}">↳ placer ici</button>`);
    else if (k < s.placees.length) frise.push('<div style="height:8px"></div>');
    if (k < s.placees.length) {
      const p = s.placees[k];
      const cls = s.revele && p.ordre === s.revele.ordre ? (s.revele.bon ? ' bon' : ' faux') : '';
      frise.push(`<div class="fcarte${cls}"><span class="t">${esc(p.titre)}</span>${p.ref ? ` <span class="r">· ${esc(p.ref)}</span>` : ''}</div>`);
    }
  }
  const courante = s.courante
    ? `<div class="acarte"><span class="lbl">${s.participants ? 'Au tour de ' + esc(s.participants[s.tour].nom) + ' — c' : 'C'}arte ${faites + 1} / ${s.total}</span>
        <p class="titre">${esc(s.courante.titre)}</p>
        <!-- pas de référence ici : elle donnerait la réponse — elle
             apparaît à la révélation, quand la carte rejoint la frise --></div>`
    : '';
  return `<div class="fade">
    <div class="topline"><span>${s.participants ? esc(s.titre) : esc(s.titre) + ' · <b>' + s.score + '</b> bien placée' + (s.score > 1 ? 's' : '')}</span>
      <button class="quit" data-quit="1">Quitter</button></div>
    ${tablee}
    ${courante}
    ${fb}
    <p class="sep">La frise — du plus ancien au plus récent</p>
    <div class="frise">${frise.join('')}</div>
  </div>`;
}

function vueFinMulti() {
  const cls = seance.participants.slice().sort((a, b) => b.score - a.score);
  const top = cls[0].score;
  const gagnants = cls.filter(p => p.score === top);
  const mot = gagnants.length > 1
    ? 'Ex æquo en tête — la frise vous départagera une autre fois 🙂'
    : `${esc(gagnants[0].nom)} connaît sa frise 🏅`;
  const lignes = cls.map((p, i) => `<div class="frow ${p.score === top ? 'tete' : ''}">
      <span>${i + 1}. ${esc(p.nom)}</span><b>${p.score} carte${p.score > 1 ? 's' : ''}</b></div>`).join('');
  return `<div class="card fin fade">
    <p style="margin:0 0 12px;font-weight:650">${mot}</p>
    ${lignes}
    <button class="btn btn-primary" data-encore="1">Rejouer la tablée</button>
    <button class="btn btn-ghost" data-quit="1">Revenir à l'accueil</button>
  </div>`;
}

/* Fin d'une séance de défi à distance : le score part au serveur (une seule
   fois), puis on bascule sur l'écran de résultat qui s'actualise tout seul. */
function envoyerScoreDuel() {
  const s = seance;
  s.envoye = true;
  const corps = s.enLigne.cle
    ? { score: s.score, cle: s.enLigne.cle }
    : { score: s.score, pseudo: s.enLigne.pseudo };
  api('duel/' + s.enLigne.code + '/score', corps)
    .then(resultat => { online = { code: s.enLigne.code, resultat: resultat, erreur: null }; ecran = 'dres'; render(); })
    .catch(e => { online = { code: s.enLigne.code, resultat: null, erreur: e.message }; ecran = 'dres'; render(); });
}

function vueFin() {
  if (seance.enLigne) {
    if (!seance.envoye) envoyerScoreDuel();
    return `<div class="card fin fade"><div class="score">${seance.score} / ${seance.total}</div>
      <p class="muted" style="margin:10px 0 0">On envoie ton score…</p></div>`;
  }
  if (seance.participants) return vueFinMulti();
  const s = seance;
  const parfait = s.score === s.total;
  const bien = s.score >= Math.ceil(s.total * 0.7);
  const mot = parfait ? 'Sans une seule erreur — la frise est limpide pour toi ✨'
    : bien ? 'Belle séance — les repères se mettent en place 🌱'
    : "Chaque carte mal placée t'a montré sa vraie place — c'est comme ça qu'on apprend 🌱";
  return `<div class="card fin fade">
    <div class="score">${s.score} / ${s.total}</div>
    <p class="muted" style="margin:6px 0 0">carte${s.score > 1 ? 's' : ''} bien placée${s.score > 1 ? 's' : ''} du premier coup</p>
    <p style="margin:14px 0 0">${mot}</p>
    <button class="btn btn-primary" data-encore="1">Refaire une séance</button>
    <button class="btn btn-ghost" data-quit="1">Changer d'épreuve</button>
  </div>`;
}

function render() {
  el.classList.toggle('proj', ecran === 'proj'); // la projection s'étale en largeur
  el.innerHTML = ecran === 'seance' ? vueSeance() : ecran === 'fin' ? vueFin()
    : ecran === 'scfg' ? vueSoloCfg()
    : ecran === 'config' ? vueConfig()
    : ecran === 'dcfg' ? vueDuelConfig() : ecran === 'join' ? vueJoin()
    : ecran === 'dres' ? vueDuelResultat() : ecran === 'vcfg' ? vueVeilleeConfig()
    : ecran === 'anim' ? vueAnim() : ecran === 'part' ? vuePart()
    : ecran === 'proj' ? vueProj()
    : vueAccueil();
  const solo = el.querySelector('[data-solo]');
  if (solo) solo.addEventListener('click', () => { ecran = 'scfg'; render(); });
  const sologo = el.querySelector('[data-sologo]');
  if (sologo) sologo.addEventListener('click', () => demarrer(config.mode, config.portee, null));
  el.querySelectorAll('[data-slot]').forEach(b =>
    b.addEventListener('click', () => placer(+b.dataset.slot)));
  const q = el.querySelector('[data-quit]');
  if (q) q.addEventListener('click', quitter);
  const enc = el.querySelector('[data-encore]');
  if (enc) enc.addEventListener('click', () => {
    // Rejouer : même paquet — et même tablée s'il y en avait une.
    demarrer(seance.mode, seance.portee, seance.participants ? seance.participants.map(p => p.nom) : null);
  });
  // À plusieurs : préparation de la tablée
  const multi = el.querySelector('[data-multi]');
  if (multi) multi.addEventListener('click', () => { ecran = 'config'; render(); });
  const retourDefi = el.querySelector('[data-retour-defi]');
  if (retourDefi) retourDefi.addEventListener('click', () => { location.href = '../defi/'; });
  const reprise = el.querySelector('[data-reprise]');
  if (reprise) reprise.addEventListener('click', async () => {
    if (!repriseAnim) return;
    online = { code: repriseAnim.code, cle: repriseAnim.cle, etat: null };
    ecran = 'anim'; render();
    try { online.etat = await api('veillee/' + online.code + '/etat?cle=' + online.cle); render(); } catch (e) {}
    pollDemarre();
  });
  el.querySelectorAll('[data-deck]').forEach(b => b.addEventListener('click', () => {
    const [m, p] = b.dataset.deck.split(':');
    config.mode = m; config.portee = p; render();
  }));
  el.querySelectorAll('[data-niveau]').forEach(b => b.addEventListener('click', () => {
    config.niveau = +b.dataset.niveau; render();
  }));
  // Les prénoms se tapent sans re-rendu (sinon le clavier perdrait le focus).
  el.querySelectorAll('[data-nom]').forEach(inp => inp.addEventListener('input', () => {
    config.noms[+inp.dataset.nom] = inp.value;
  }));
  const addp = el.querySelector('[data-addp]');
  if (addp) addp.addEventListener('click', () => { if (config.noms.length < 6) { config.noms.push(''); render(); } });
  const delp = el.querySelector('[data-delp]');
  if (delp) delp.addEventListener('click', () => { if (config.noms.length > 2) { config.noms.pop(); render(); } });
  const ms = el.querySelector('[data-multistart]');
  if (ms) ms.addEventListener('click', () => {
    const noms = config.noms.map((n, i) => n.trim() !== '' ? n.trim() : 'Participant ' + (i + 1));
    demarrer(config.mode, config.portee, noms);
  });

  /* ---- À distance ---- */
  const versEcran = e => () => { ecran = e; render(); };
  if (el.querySelector('[data-duelcfg]')) el.querySelector('[data-duelcfg]').addEventListener('click', versEcran('dcfg'));
  if (el.querySelector('[data-veilcfg]')) el.querySelector('[data-veilcfg]').addEventListener('click', versEcran('vcfg'));
  if (el.querySelector('[data-join]')) el.querySelector('[data-join]').addEventListener('click', versEcran('join'));
  // champs : l'état est la source de vérité, pas de re-rendu pendant la frappe
  const inPseudo = el.querySelector('#in-pseudo');
  if (inPseudo) inPseudo.addEventListener('input', () => { saisie.pseudo = inPseudo.value; });
  const inCode = el.querySelector('#in-code');
  if (inCode) inCode.addEventListener('input', () => { saisie.code = inCode.value; });
  const erreurLigne = msg => {
    const n = el.querySelector('#err-ligne');
    if (n) n.textContent = msg;
  };

  const duelgo = el.querySelector('[data-duelgo]');
  if (duelgo) duelgo.addEventListener('click', async () => {
    const pseudo = saisie.pseudo.trim();
    if (pseudo === '') { erreurLigne('Ton prénom, pour que ton ami sache qui le défie 🙂'); return; }
    duelgo.disabled = true;
    try {
      const deck = deckServeur(config.mode, config.portee, CARTES_PAR_SEANCE);
      const r = await api('duel', { pseudo: pseudo, mode: titrePaquet(config.mode, config.portee), deck: deck });
      demarrerServi(deck, titrePaquet(config.mode, config.portee), { code: r.code, cle: r.cle });
    } catch (e) { duelgo.disabled = false; erreurLigne(e.message); }
  });

  const joingo = el.querySelector('[data-joingo]');
  if (joingo) joingo.addEventListener('click', async () => {
    const code = saisie.code.trim().toUpperCase();
    const prenom = saisie.pseudo.trim();
    if (prenom === '') { erreurLigne('Ton prénom, pour le classement 🙂'); return; }
    joingo.disabled = true;
    try {
      if (code.startsWith('FD-')) {
        const r = await api('duel/' + code);
        if (r.p2) throw new Error('Ce défi a déjà trouvé son adversaire.');
        demarrerServi(r.deck, r.mode, { code: code, pseudo: prenom });
      } else if (code.startsWith('FV-')) {
        const r = await api('veillee/' + code + '/rejoindre', { prenom: prenom });
        online = { code: code, jeton: r.jeton, prenom: prenom, etat: null };
        ecran = 'part'; render(); pollDemarre();
      } else {
        throw new Error('Un code commence par FD- (défi) ou FV- (veillée).');
      }
    } catch (e) { joingo.disabled = false; erreurLigne(e.message); }
  });

  const veilgo = el.querySelector('[data-veilgo]');
  if (veilgo) veilgo.addEventListener('click', async () => {
    veilgo.disabled = true;
    try {
      const deck = deckServeur(config.mode, config.portee, CARTES_PAR_SEANCE);
      const r = await api('veillee', { mode: titrePaquet(config.mode, config.portee), deck: deck });
      online = { code: r.code, cle: r.cle, etat: null };
      animEcrire({ code: r.code, cle: r.cle, ts: Date.now() });
      ecran = 'anim'; render(); pollDemarre();
    } catch (e) { veilgo.disabled = false; erreurLigne(e.message); }
  });

  const avancer = el.querySelector('[data-avancer]');
  if (avancer) avancer.addEventListener('click', async () => {
    // un seul « avancer » à la fois : le bouton renaît à chaque rafraîchissement,
    // un double-tap pressé ne doit pas faire sauter une phase entière.
    if (online.enVol) return;
    online.enVol = true;
    avancer.disabled = true;
    try {
      online.etat = await api('veillee/' + online.code + '/avancer', { cle: online.cle });
      online.v = (online.v || 0) + 1;
      online.enVol = false;
      render();
    } catch (e) { online.enVol = false; render(); }
  });

  el.querySelectorAll('[data-pos]').forEach(b => b.addEventListener('click', async () => {
    el.querySelectorAll('[data-pos]').forEach(x => { x.disabled = true; });
    try {
      online.etat = await api('veillee/' + online.code + '/reponse',
        { jeton: online.jeton, carte: online.etat.carte, position: +b.dataset.pos });
      online.v = (online.v || 0) + 1;
      render();
    } catch (e) { render(); }
  }));

  const projgo = el.querySelector('[data-projgo]');
  if (projgo) projgo.addEventListener('click', async () => {
    const code = saisie.code.trim().toUpperCase();
    if (!code.startsWith('FV-')) {
      const n = el.querySelector('#err-ligne');
      if (n) n.textContent = 'Le grand écran affiche une veillée : il faut un code FV-.';
      return;
    }
    projgo.disabled = true;
    try {
      await api('veillee/' + code + '/etat'); // le code existe-t-il ?
      online = { code: code, projection: true, etat: null };
      ecran = 'proj'; render(); pollDemarre();
    } catch (e) {
      projgo.disabled = false;
      const n = el.querySelector('#err-ligne');
      if (n) n.textContent = e.message;
    }
  });

  const copieLien = el.querySelector('[data-copie-lien]');
  if (copieLien) copieLien.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(copieLien.dataset.copieLien); copieLien.textContent = 'Adresse copiée ✓'; }
    catch (e) { copieLien.textContent = 'Copie impossible — recopie-la à la main'; }
    setTimeout(() => { copieLien.textContent = "Copier l'adresse du grand écran"; }, 2400);
  });

  const copie = el.querySelector('[data-copie]');
  if (copie) copie.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(copie.dataset.copie); copie.textContent = 'Code copié ✓'; }
    catch (e) { copie.textContent = 'Copie impossible — note-le à la main'; }
    setTimeout(() => { copie.textContent = 'Copier le code'; }, 2400);
  });

  // l'écran de résultat de défi s'actualise tant que l'adversaire manque
  if (ecran === 'dres' && online && !online.erreur && !minuterie) pollDemarre();
}
/* Arrivée directe sur le grand écran : ?direct=FV-XXXXX (l'adresse que
   l'animateur copie pour l'ordinateur du projecteur). */
async function verifierRepriseAnim() {
  const a = animLire();
  if (!a || !a.code || !a.cle) return;
  if (Date.now() - (a.ts || 0) > 86400000) { animOubli(); return; } // >24 h : le ménage serveur est passé
  try {
    const etat = await api('veillee/' + a.code + '/etat?cle=' + a.cle);
    if (etat && etat.phase && etat.phase !== 'fin') { repriseAnim = { code: a.code, cle: a.cle }; if (ecran === 'accueil') render(); }
    else animOubli();
  } catch (e) { if (e && e.status === 404) animOubli(); } // veillée disparue : on oublie
}

const direct = new URLSearchParams(location.search).get('direct');
if (direct && /^FV-[A-Z2-9]{5}$/.test(direct.toUpperCase())) {
  online = { code: direct.toUpperCase(), projection: true, etat: null };
  ecran = 'proj';
  pollDemarre();
}
render();
if (!online) verifierRepriseAnim(); // pas de projection en cours : propose la reprise si besoin
</script>
