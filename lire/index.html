<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lire — Bible Horizon</title>
  <meta name="description" content="Un plan de lecture biblique qui est un chemin, pas un calendrier : tu avances à ton rythme, sans jamais prendre de retard." />
  <!-- Cartes de partage (WhatsApp, réseaux) : titre, description, visuel. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Bible Horizon" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:title" content="Lire la Bible — Bible Horizon" />
  <meta property="og:description" content="Un plan de lecture qui est un chemin, pas un calendrier : tu avances à ton rythme, sans jamais prendre de retard. Gratuit, sans publicité." />
  <meta property="og:url" content="https://biblehorizon.fr/lire/" />
  <meta property="og:image" content="https://biblehorizon.fr/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#f7f3ea" />
  <script>
    /* Anti-flash : applique le thème choisi (localStorage 'graine.theme') AVANT
       le chargement du CSS, et fait suivre la couleur de barre du navigateur. */
    (function () {
      try {
        var choix = localStorage.getItem('graine.theme');
        if (choix === 'clair' || choix === 'sombre' || choix === 'sepia') {
          document.documentElement.setAttribute('data-theme', choix);
        }
        var fonds = { clair: '#f7f3ea', sombre: '#141b28', sepia: '#f2e6cf' };
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var maj = function () {
          var t = document.documentElement.getAttribute('data-theme') || (mq.matches ? 'sombre' : 'clair');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', fonds[t] || fonds.clair);
        };
        maj();
        if (mq.addEventListener) mq.addEventListener('change', maj);
      } catch (e) { /* stockage indisponible : on suit simplement le système */ }
    })();
  </script>
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bible Horizon" />
  <link rel="stylesheet" href="../app.css" />
  <link rel="stylesheet" href="lire.css" />
</head>
<body>
  <div id="app" aria-live="polite"></div>

  <script src="../icons.js" defer></script>
  <script src="../pierres.js" defer></script>
  <script src="lire.js" defer></script>
</body>
</html>
