<script>
  /* Anti-flash : applique le thème choisi AVANT le rendu — même mécanique
     que les autres modules. */
  (function () {
    try {
      var choix = localStorage.getItem('graine.theme');
      if (choix === 'clair' || choix === 'sombre' || choix === 'sepia') {
        document.documentElement.setAttribute('data-theme', choix);
      }
      var fonds = { clair: '#f7f3ea', sombre: '#141b28', sepia: '#f2e6cf' };
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var maj = function () {
        var t = document.documentElement.getAttribute('data-theme') || (mq.matches ? 'sombre' : 'clair');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', fonds[t] || fonds.clair);
      };
      maj();
      if (mq.addEventListener) mq.addEventListener('change', maj);
    } catch (e) { /* stockage indisponible : on suit le système */ }
  })();

<!-- Banque d'église (?eglise=GRP-XXXXX) ajoutée À LA MAIN dans les trois
     pages : le gabarit gen-epreuve.py, absent du dépôt, ne la connaît pas —
     à reporter dedans si la page est réengendrée un jour. -->
<script src="../visite.js" defer></script>
<script>
'use strict';
if (!window.icon) window.icon = function () { return ''; };

const TITRE = "Écrit… ou pas ?";
const CARTES_PAR_SEANCE = 10;

/* La banque « Écrit… ou pas ? » → forme commune {q, options, bonne, ref, rev}. */
function adapter(brut) {
  return (brut.items || []).map(it => ({
    q: it.phrase,
    options: ["C'est écrit", "Ce n'est pas écrit"],
    bonne: it.ecrit ? 0 : 1,
    ref: it.reference || null, rev: it.precision || null,
  }));
}

/* ---------- Aides ---------- */
const el = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }

/* La banque, chargée une fois. Chaque tirage mélange aussi l'ordre des
   options (bonne remappée) — sauf pour les binaires, dont l'ordre est fixe.
   Même mécanique que le Défi : la copie mémorisée sur l'appareil d'abord,
   le serveur consulté en arrière-plan pour la PROCHAINE ouverture, et le
   fichier embarqué (pré-caché) en dernier filet — hors-ligne compris. */
let BANQUE = null;
const BANQUE_KEY = 'graine.ecritoupas.banque.v1'; // copie locale de la banque vivante
function lireBanqueLocale() { try { return JSON.parse(localStorage.getItem(BANQUE_KEY) || 'null'); } catch (e) { return null; } }
function ecrireBanqueLocale(d) { try { localStorage.setItem(BANQUE_KEY, JSON.stringify(d)); } catch (e) {} }
async function telechargerBanque() {
  // La banque « vivante » du serveur (elle inclut les retouches de
  // l'administration). La page vit dans /ecritoupas/, l'API à la racine : ../api.
  try {
    const r = await fetch('../api/banque/ecritoupas', { cache: 'no-cache' });
    if (r.ok) {
      const d = await r.json();
      if (d && Array.isArray(d.items) && d.items.length > 0) return d;
    }
  } catch (e) { /* pas de réseau : la copie locale ou le fichier suffira */ }
  return null;
}
async function chargerBanque() {
  if (BANQUE) return BANQUE;
  // La banque de MON ÉGLISE passe d'abord (?eglise=GRP-XXXXX, responsable
  // connecté — le serveur revérifie, 403 sinon). Jamais de copie locale pour
  // elle : elle change au gré du responsable ; inaccessible ou trop maigre
  // (moins de 3 items), la banque commune reprend la main et l'accueil dit
  // d'où l'on tire.
  // Une SÉRIE choisie par le joueur prend le relais de la banque commune —
  // et seulement si elle est choisie. Par défaut, on joue le fonds commun :
  // les questions d'une église s'ajoutent au choix, elles ne le remplacent pas.
  if (serieChoisie && EGLISE && window.GraineAPI && GraineAPI.isLoggedIn()) {
    try {
      const d = await GraineAPI.groupeSerieItems(EGLISE, 'ecritoupas', serieChoisie);
      if (d && Array.isArray(d.items) && d.items.length > 0) {
        egliseActive = true;
        serieMarquerJouee(serieChoisie);   // ✓ dans la liste, la prochaine fois
        BANQUE = adapter(d);
        return BANQUE;
      }
    } catch (e) { /* série retirée, hors-ligne : la banque commune reprend */ }
    serieChoisie = null;   // la série a disparu : on ne bloque pas le joueur
  }
  const locale = lireBanqueLocale();
  if (locale && Array.isArray(locale.items) && locale.items.length > 0) {
    // Copie locale : on la sert tout de suite, et on rafraîchit derrière —
    // jamais en pleine séance, le tirage ne change pas sous les pieds.
    BANQUE = adapter(locale);
    telechargerBanque().then(d => { if (d) ecrireBanqueLocale(d); }).catch(() => {});
    return BANQUE;
  }
  // Première visite (ou copie absente) : le serveur, sinon le fichier
  // embarqué (et pré-caché) du module — repli silencieux.
  let d = await telechargerBanque();
  if (d) ecrireBanqueLocale(d);
  else {
    const r = await fetch('data/banque.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('La banque de l\'épreuve n\'a pas pu être chargée.');
    d = await r.json();
  }
  BANQUE = adapter(d);
  return BANQUE;
}
/* Le choix de la banque, sur l'accueil. On ne le montre QUE si l'église a
   publié des séries : sans cela, ouvrir l'épreuve reste un seul geste. La
   banque complète est toujours là, en tête — une série s'ajoute au choix,
   elle ne remplace rien. */
/* Le défi qu'on a lancé, et sa réponse. Il n'existe pas d'écran de retour
   pour celui qui l'a lancé : la carte porte donc le résultat elle-même. */
/* La carte du dernier défi lancé, VUE DEPUIS « Défier un ami » : c'est sa
   place naturelle (l'accueil du jeu reste consacré aux manières de jouer).
   Connecté, « Tes duels » raconte déjà ce duel-là — la carte s'efface pour
   ne pas faire doublon ; elle reste le seul repère des défis par code. */
function duelMenuLanceHTML() {
  if (!repriseDuel) return '';
  if (connecte() && amisLigne && (amisLigne.duels || []).some(d => d.code === repriseDuel.code)) return '';
  return duelLanceHTML();
}
function duelLanceHTML() {
  if (!repriseDuel) return '';
  const d = repriseDuel;
  const moi = d.p1 && d.p1.score !== null ? d.p1.score : null;
  const corps = d.p2
    ? `<b>${esc(d.p2.pseudo)}</b> a répondu : <b>${d.p2.score} / ${d.total}</b>`
        + (moi !== null ? ` — toi, ${moi} / ${d.total}.` : '.')
    : d.invite
      ? `Ton défi attend <b>${esc(d.invite)}</b> — il le trouvera dans « Défier un ami ».`
      : `Personne n'a encore répondu. Le code à partager : <b>${esc(d.code)}</b>`;
  // Jamais relevé et la clé est là : on peut vraiment l'ANNULER (le code
  // meurt côté serveur, et il quitte la liste de l'ami invité). Sinon —
  // défi relevé, ou lancé avant que la clé ne soit gardée — on cache.
  const bouton = !d.p2 && d.cle
    ? `<button class="btn btn-ghost btn-block" data-duel-annule="1">Annuler ce défi</button>`
    : `<button class="btn btn-ghost btn-block" data-duel-oubli="1">Ne plus l'afficher</button>`;
  return `<div class="card fade" style="margin:-4px 0 16px">
    <p style="margin:0 0 8px">${corps}</p>
    ${bouton}
  </div>`;
}

function choixBanqueHTML() {
  if (!SERIES || !SERIES.length) return '';
  const pastille = (id, nom, jouee) =>
    `<button class="pill ${serieChoisie === id ? 'on' : ''}" data-serie="${id === null ? '' : id}">`
    + `${esc(nom)}${jouee ? ' ✓' : ''}</button>`;

    ? `<p style="margin:8px 0 0"><a class="muted" style="font-size:.78rem"
         href="mailto:contact@biblehorizon.fr?subject=${encodeURIComponent('Signalement — série ' + choisie.id + ' (' + TITRE + ')')}&body=${encodeURIComponent('Série : ' + choisie.nom + '\nÉglise : ' + EGLISE + '\n\nCe qui pose problème :\n')}"
         >Signaler un contenu de cette série</a></p>`
    : '';
  return `<div style="margin:-4px 0 16px">

      EGLISE_NOM ? ` <b>· ${esc(EGLISE_NOM)}</b>` : ''}</div>
    <div class="pill-row">
      ${pastille(null, 'Banque complète', false)}
      ${SERIES.map(x => pastille(x.id, x.nom, serieDejaJouee(x.id))).join('')}
    </div>
    ${signaler}
  </div>`;
}

function tirage(n) {
  return shuffle(BANQUE).slice(0, n).map(item => {
    if (item.options.length <= 2) return { ...item };
    const ordre = shuffle(item.options.map((_, i) => i));
    return { ...item, options: ordre.map(i => item.options[i]), bonne: ordre.indexOf(item.bonne) };
  });
}

function demarrer(noms, enLigne, itemsServis) {
  const n = noms ? noms.length : 0;
  const parTete = noms ? Math.max(3, Math.min(5, Math.floor(BANQUE.length / n))) : 0;
  const items = itemsServis || tirage(noms ? parTete * n : CARTES_PAR_SEANCE);
  seance = {
    items: items, idx: 0, phase: 'question', choix: null,
    score: 0, total: items.length,
    participants: noms ? noms.map(nom => ({ nom: nom, score: 0 })) : null, tour: 0,
    enLigne: enLigne || null, envoye: false,
  };
  ecran = 'seance';
  render();
}
function repondre(k) {
  const s = seance;
  if (s.phase !== 'question') return;
  s.choix = k;
  s.phase = 'revele';
  if (k === s.items[s.idx].bonne) {
    if (s.participants) s.participants[s.tour].score++; else s.score++;
  }
  render();
}
function suivante() {
  const s = seance;
  s.idx++;
  s.phase = 'question';
  s.choix = null;
  if (s.participants) s.tour = (s.tour + 1) % s.participants.length;
  if (s.idx >= s.items.length) ecran = 'fin';
  render();
}

/* ---------- À distance ---------- */
/* Les en-têtes d'un envoi d'épreuve : la session du compte (si elle existe)
   accompagne l'appel — c'est elle qui permet de défier un AMI (opponentCode)
   au lieu d'échanger un code à la main. Sans compte, rien ne change. */
function entetesApi() {
  const e = { 'Content-Type': 'application/json' };
  try {
    const s = window.GraineAPI && GraineAPI.session();
    if (s && s.token) e['Authorization'] = 'Bearer ' + s.token;
  } catch (err) { /* pas de client API : le défi par code suffit */ }
  return e;
}
async function api(chemin, corps) {
  const r = await fetch('../api/epreuve/' + chemin, corps === undefined ? {}
    : { method: 'POST', headers: entetesApi(), body: JSON.stringify(corps) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(data.error || 'Le serveur a répondu ' + r.status + '.'); err.status = r.status; throw err; }
  return data;
}

function vueDuelResultat() {
  const o = online;
  const r = o.resultat;
  let corps = '';
  if (o.erreur) corps = `<p class="feedback faux">${esc(o.erreur)}</p>`;
  else if (r) {
    const ligne = j => j ? `<div class="frow"><span>${esc(j.pseudo)}</span><b>${j.score === null ? 'pas encore terminé' : j.score + ' / ' + r.total}</b></div>` : '';
    let verdict = '';
    if (r.p1 && r.p2 && r.p1.score !== null && r.p2.score !== null) {
      verdict = r.p1.score === r.p2.score ? '<p style="font-weight:650;margin:12px 0 0">Égalité parfaite 🙂</p>'
        : `<p style="font-weight:650;margin:12px 0 0">${esc(r.p1.score > r.p2.score ? r.p1.pseudo : r.p2.pseudo)} connaît ses textes 🏅</p>`;

        ? `<p class="muted" style="margin:12px 0 0">En attente de <b>${esc(r.invite)}</b> — le défi l'attend dans son écran « Défier un ami », pas besoin de code.</p>`

/* Vu de l'animateur : où en est le mode, et l'interrupteur. Reprendre la main
   ne referme rien — la salle reste ouverte, seul le rythme change de mains. */
function htmlAutoAnim(e) {
  if (!e || e.phase === 'fin') return '';
  if (e.auto) {
    return `<button class="btn btn-ghost" data-autobascule="0" style="margin-top:8px">Reprendre la main</button>`;
  }
  return `<button class="btn btn-ghost" data-autobascule="1" style="margin-top:8px">Laisser la veillée s'enchaîner toute seule</button>`;
}

/* ---- Le décompte, ANNONCÉ ------------------------------------------------
   Une pastille fixe, hors de l'écran re-rendu : le grand écran comme les
   téléphones voient les secondes tomber, et personne n'est surpris de voir
   la carte tourner. Le serveur donne `restant` à chaque sondage (2,5 s) ;
   entre deux sondages, on décompte localement depuis ce repère. */
function majDecompte() {
  let b = document.getElementById('decompte-veillee');
  const enLigne = (ecran === 'anim' || ecran === 'part' || ecran === 'proj') && online && online.etat ? online.etat : null;
  let reste = null;
  if (enLigne && enLigne.auto && enLigne.restant != null && enLigne.phase !== 'fin' && enLigne.phase !== 'attente') {
    const depuis = online.resteTs ? Math.floor((Date.now() - online.resteTs) / 1000) : 0;
    reste = Math.max(0, enLigne.restant - depuis);
  }
  if (reste === null) { if (b) b.hidden = true; return; }
  if (!b) {
    b = document.createElement('div');
    b.id = 'decompte-veillee';
    b.style.cssText = 'position:fixed;top:10px;right:10px;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:clamp(.92rem,2.2vw,1.5rem);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)';
    document.body.appendChild(b);
  }
  b.hidden = false;
  b.textContent = enLigne.phase === 'revele' ? 'On enchaîne dans ' + reste + ' s' : '⏳ ' + reste + ' s';
}
setInterval(majDecompte, 1000);

/* ---------- L'interrogation régulière (écrans en ligne) ---------- */
function pollArret() { if (minuterie) { clearInterval(minuterie); minuterie = null; } }
function pollDemarre() {
  pollArret();
  minuterie = setInterval(async () => {
    try {
      if (ecran === 'dres' && online && !online.erreur) {
        const r = await api('duel/' + online.code);
        if (JSON.stringify(r) !== JSON.stringify(online.resultat)) { online.resultat = r; render(); }
        if (r.p1 && r.p2 && r.p1.score !== null && r.p2.score !== null) pollArret();
      } else if ((ecran === 'anim' || ecran === 'part' || ecran === 'proj') && online) {
        const vAvant = online.v || 0;
        const q = ecran === 'anim' ? 'cle=' + online.cle : ecran === 'part' ? 'jeton=' + online.jeton : '';
        const e = await api('veillee/' + online.code + '/etat' + (q ? '?' + q : ''));
        if (online) { online.resteTs = Date.now(); }
        majDecompte();
        if (online && (online.v || 0) === vAvant
            && JSON.stringify(e) !== JSON.stringify(online.etat)) { online.etat = e; render(); }
        if (online && online.cle && e && e.phase === 'fin') animOubli(); // veillée finie : plus rien à reprendre
      } else {
        pollArret();
      }
    } catch (err) {
      // 404 : la veillée n'existe plus (expirée, ou ménage passé) — on prévient
      // au lieu de laisser l'écran figé. Tout autre raté : on retentera.
      if (err && err.status === 404 && (ecran === 'anim' || ecran === 'part' || ecran === 'proj')) {
        pollArret();
        el.innerHTML = `<div class="fade" style="text-align:center;padding:48px 22px">`
          + `<p style="font-size:1.15rem;margin:0 0 6px">Cette veillée n'existe plus.</p>`
          + `<p class="muted" style="margin:0 0 22px">Elle a peut-être expiré — une veillée ne vit qu'un temps.</p>`
          + `<button class="btn btn-primary" data-perdu="1">Revenir au début</button></div>`;
        const b = el.querySelector('[data-perdu]');
        if (b) b.onclick = () => { location.href = './'; };
      }
    }
  }, 2500);
}

/* ---------- Rendu & câblage ---------- */
function render() {
  el.classList.toggle('proj', ecran === 'proj');
  el.innerHTML = ecran === 'seance' ? vueSeance() : ecran === 'fin' ? vueFin()
    : ecran === 'config' ? vueConfig()
    : ecran === 'dmenu' ? vueDuelMenu() : ecran === 'vmenu' ? vueVeilleeMenu()
    : ecran === 'dcfg' ? vueDuelConfig() : ecran === 'djoin' ? vueJoin(false)
    : ecran === 'vjoin' ? vueJoin(true) : ecran === 'vproj' ? vueProjection()
    : ecran === 'dres' ? vueDuelResultat() : ecran === 'vcfg' ? vueVeilleeConfig()
    : ecran === 'anim' ? vueAnim() : ecran === 'part' ? vuePart()
    : ecran === 'proj' ? vueProj()
    : vueAccueil();

  const q1 = el.querySelector.bind(el);
  const versEcran = e => () => { ecran = e; render(); };
  const erreurLigne = msg => { const n = q1('#err-ligne'); if (n) n.textContent = msg; };
  const avecBanque = fn => async (ev) => {
    const b = ev.currentTarget;
    b.disabled = true;
    try { await chargerBanque(); fn(); }
    catch (e) { b.disabled = false; alert('La banque de l\'épreuve n\'a pas pu être chargée — vérifie ta connexion.'); }
  };

  if (q1('[data-retour-defi]')) q1('[data-retour-defi]').addEventListener('click', () => { location.href = '../defi/'; });
  if (q1('[data-reprise]')) q1('[data-reprise]').addEventListener('click', async () => {
    if (!repriseAnim) return;
    online = { code: repriseAnim.code, cle: repriseAnim.cle, etat: null };
    ecran = 'anim'; render();
    try { online.etat = await api('veillee/' + online.code + '/etat?cle=' + online.cle); render(); } catch (e) {}
    pollDemarre();
  });
  if (q1('[data-duel-oubli]')) q1('[data-duel-oubli]').addEventListener('click', () => {
    duelOubli(); repriseDuel = null; render();
  });
  if (q1('[data-duel-annule]')) q1('[data-duel-annule]').addEventListener('click', async (ev) => {
    ev.currentTarget.disabled = true;
    try { await api('duel/' + repriseDuel.code + '/annuler', { cle: repriseDuel.cle }); }
    catch (e) { /* déjà balayé ou relevé entre-temps : la carte s'efface, le serveur a le dernier mot */ }
    duelOubli(); repriseDuel = null; render();
  });
  el.querySelectorAll('[data-serie]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.serie;
    serieChoisie = v === '' ? null : Number(v);
    BANQUE = null;              // le prochain tirage relira la bonne source
    egliseActive = false;
    render();
  }));
  if (q1('[data-solo]')) q1('[data-solo]').addEventListener('click', avecBanque(() => demarrer(null, null, null)));
  if (q1('[data-multi]')) q1('[data-multi]').addEventListener('click', versEcran('config'));
  // sous-menus et retours : la carte (ou le lien) porte l'écran où elle mène
  el.querySelectorAll('[data-vers]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.vers === 'dmenu') { amisLigne = null; amisErreur = null; } // duels toujours frais
    versEcran(b.dataset.vers)();
  }));
  if (q1('[data-quit]')) q1('[data-quit]').addEventListener('click', quitter);

  el.querySelectorAll('[data-rep]').forEach(b => b.addEventListener('click', () => repondre(+b.dataset.rep)));
  if (q1('[data-suiv]')) q1('[data-suiv]').addEventListener('click', suivante);
  if (q1('[data-encore]')) q1('[data-encore]').addEventListener('click', () =>
    demarrer(seance.participants ? seance.participants.map(p => p.nom) : null, null, null));

  el.querySelectorAll('[data-nom]').forEach(inp => inp.addEventListener('input', () => {
    config.noms[+inp.dataset.nom] = inp.value;
  }));
  if (q1('[data-addp]')) q1('[data-addp]').addEventListener('click', () => { if (config.noms.length < 6) { config.noms.push(''); render(); } });
  if (q1('[data-delp]')) q1('[data-delp]').addEventListener('click', () => { if (config.noms.length > 2) { config.noms.pop(); render(); } });
  if (q1('[data-multistart]')) q1('[data-multistart]').addEventListener('click', avecBanque(() => {
    demarrer(config.noms.map((n, i) => n.trim() !== '' ? n.trim() : 'Participant ' + (i + 1)), null, null);
  }));

  const inPseudo = q1('#in-pseudo');
  if (inPseudo) inPseudo.addEventListener('input', () => { saisie.pseudo = inPseudo.value; });
  const inCode = q1('#in-code');
  if (inCode) inCode.addEventListener('input', () => { saisie.code = inCode.value; });

  const duelgo = q1('[data-duelgo]');
  if (duelgo) duelgo.addEventListener('click', async () => {
    const pseudo = saisie.pseudo.trim();
    if (pseudo === '') { erreurLigne('Ton prénom, pour que ton ami sache qui le défie 🙂'); return; }
    duelgo.disabled = true;
    try {
      await chargerBanque();
      const deck = tirage(CARTES_PAR_SEANCE);
      const r = await api('duel', { pseudo: pseudo, mode: TITRE, deck: deck });
      duelEcrire({ code: r.code, cle: r.cle, ts: Date.now() });
      demarrer(null, { code: r.code, cle: r.cle }, deck);
    } catch (e) { duelgo.disabled = false; erreurLigne(e.message); }
  });

  // Défier un AMI en un geste : le défi part relié à son compte — il le
  // trouvera dans son écran « Défier un ami », sans code à recopier.
  el.querySelectorAll('[data-defiami]').forEach(b => b.addEventListener('click', async () => {
    el.querySelectorAll('[data-defiami]').forEach(x => { x.disabled = true; });
    try {
      await chargerBanque();
      const deck = tirage(CARTES_PAR_SEANCE);
      const r = await api('duel', { mode: TITRE, deck: deck, opponentCode: b.dataset.defiami });
      duelEcrire({ code: r.code, cle: r.cle, ts: Date.now() });
      demarrer(null, { code: r.code, cle: r.cle }, deck);
    } catch (e) {
      el.querySelectorAll('[data-defiami]').forEach(x => { x.disabled = false; });
      erreurLigne(e.message);
    }
  }));
  // …et relever celui qu'un ami m'a envoyé.
  el.querySelectorAll('[data-defirecu]').forEach(b => b.addEventListener('click', async () => {
    el.querySelectorAll('[data-defirecu]').forEach(x => { x.disabled = true; });
    try {
      const code = b.dataset.defirecu;
      const r = await api('duel/' + code);
      if (r.p2) throw new Error('Ce défi a déjà trouvé son adversaire.');
      const dInfo = amisLigne && (amisLigne.defis || []).find(x => x.code === code);
      // Relevé : il quitte la liste (et le badge) sans attendre le serveur.
      if (amisLigne) amisLigne.defis = (amisLigne.defis || []).filter(x => x.code !== code);
      demarrer(null, { code: code, pseudo: monPseudo(), avec: dInfo ? dInfo.de : null }, r.deck);
    } catch (e) {
      el.querySelectorAll('[data-defirecu]').forEach(x => { x.disabled = false; });
      erreurLigne(e.message);
    }
  }));
  const actualiser = el.querySelector('[data-actualiser]');
  if (actualiser) actualiser.addEventListener('click', () => { amisLigne = null; amisErreur = null; render(); });
  // Revoir un de MES duels — en attente ou fini : l'écran de résultat,
  // rafraîchi en direct si l'autre joue pendant qu'on regarde.
  el.querySelectorAll('[data-duelvoir]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    try {
      const code = b.dataset.duelvoir;
      const r = await api('duel/' + code);
      online = { code: code, resultat: r, erreur: null, avec: b.dataset.avec || null };
      ecran = 'dres'; render();
    } catch (e) { b.disabled = false; erreurLigne(e.message); }
  }));

  const joingo = q1('[data-joingo]');
  if (joingo) joingo.addEventListener('click', async () => {
    const code = saisie.code.trim().toUpperCase();
    const prenom = saisie.pseudo.trim();
    if (prenom === '') { erreurLigne('Ton prénom, pour le classement 🙂'); return; }
    joingo.disabled = true;
    try {
      if (code.startsWith('ED-')) {
        const r = await api('duel/' + code);
        if (r.p2) throw new Error('Ce défi a déjà trouvé son adversaire.');
        demarrer(null, { code: code, pseudo: prenom }, r.deck);
      } else if (code.startsWith('EV-')) {
        const r = await api('veillee/' + code + '/rejoindre', { prenom: prenom });
        online = { code: code, jeton: r.jeton, prenom: prenom, etat: null };
        ecran = 'part'; render(); pollDemarre();
      } else if (joingo.dataset.joingo === 'veillee') {
        throw new Error("Le code de la veillée s'affiche sur le grand écran : il commence par EV- (un code ED- ouvre un défi).");
      } else {
        throw new Error('Un code de défi commence par ED- (et un code EV- rejoint une veillée en direct).');
      }
    } catch (e) { joingo.disabled = false; erreurLigne(e.message); }
  });

  const projgo = q1('[data-projgo]');
  if (projgo) projgo.addEventListener('click', async () => {
    const code = saisie.code.trim().toUpperCase();
    if (!code.startsWith('EV-')) { erreurLigne('Le grand écran affiche une veillée : il faut un code EV-.'); return; }
    projgo.disabled = true;
    try {
      await api('veillee/' + code + '/etat');
      online = { code: code, projection: true, etat: null };
      ecran = 'proj'; render(); pollDemarre();
    } catch (e) { projgo.disabled = false; erreurLigne(e.message); }
  });

  el.querySelectorAll('[data-vauto]').forEach(b => b.addEventListener('click', () => {
    vauto.actif = b.dataset.vauto === '1'; render();
  }));
  el.querySelectorAll('[data-vsec]').forEach(b => b.addEventListener('click', () => {
    vauto.seconds = parseInt(b.dataset.vsec, 10); render();
  }));
  const autob = el.querySelector('[data-autobascule]');
  if (autob) autob.addEventListener('click', async () => {
    autob.disabled = true;
    try {
      online.etat = await api('veillee/' + online.code + '/auto',
        { cle: online.cle, actif: autob.dataset.autobascule === '1', seconds: vauto.seconds });
      online.resteTs = Date.now();
      render();
    } catch (err) { render(); }
  });
  const veilgo = q1('[data-veilgo]');
  if (veilgo) veilgo.addEventListener('click', async () => {
    veilgo.disabled = true;
    try {
      await chargerBanque();
      const deck = tirage(CARTES_PAR_SEANCE);
      const r = await api('veillee', { mode: TITRE, deck: deck, auto: vauto.actif, seconds: vauto.seconds });
      online = { code: r.code, cle: r.cle, etat: null };
      animEcrire({ code: r.code, cle: r.cle, ts: Date.now() });
      ecran = 'anim'; render(); pollDemarre();
    } catch (e) { veilgo.disabled = false; erreurLigne(e.message); }
  });

  const avancer = q1('[data-avancer]');
  if (avancer) avancer.addEventListener('click', async () => {
    if (online.enVol) return;
    online.enVol = true;
    avancer.disabled = true;
    try {
      online.etat = await api('veillee/' + online.code + '/avancer', { cle: online.cle });
      online.v = (online.v || 0) + 1;
      online.enVol = false;
      render();
    } catch (e) { online.enVol = false; render(); }
  });

  el.querySelectorAll('[data-vrep]').forEach(b => b.addEventListener('click', async () => {
    el.querySelectorAll('[data-vrep]').forEach(x => { x.disabled = true; });
    try {
      online.etat = await api('veillee/' + online.code + '/reponse',
        { jeton: online.jeton, carte: online.etat.carte, choix: +b.dataset.vrep });
      online.v = (online.v || 0) + 1;
      render();
    } catch (e) { render(); }
  }));

  const copie = q1('[data-copie]');
  if (copie) copie.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(copie.dataset.copie); copie.textContent = 'Code copié ✓'; }
    catch (e) { copie.textContent = 'Copie impossible — note-le à la main'; }
    setTimeout(() => { copie.textContent = 'Copier le code'; }, 2400);
  });
  const copieLien = q1('[data-copie-lien]');
  if (copieLien) copieLien.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(copieLien.dataset.copieLien); copieLien.textContent = 'Adresse copiée ✓'; }
    catch (e) { copieLien.textContent = 'Copie impossible — recopie-la à la main'; }
    setTimeout(() => { copieLien.textContent = "Copier l'adresse du grand écran"; }, 2400);
  });

  if (ecran === 'dres' && online && !online.erreur && !minuterie) pollDemarre();

  // Connecté, l'accueil et le menu de défi savent qui sont tes amis et si
  // un défi t'attend (silencieux hors-ligne — tout le reste vit sans réseau).
  if (connecte() && (ecran === 'accueil' || ecran === 'dmenu')) { chargerAmis(); majBadgeDefis(); }
}

/* Au retour sur l'épreuve : où en est le défi qu'on a lancé ? Sept jours,
   c'est la durée de vie du code côté serveur — au-delà, on oublie. */
async function verifierRepriseDuel() {
  const d = duelLire();
  if (!d || !d.code) return;
  if (Date.now() - (d.ts || 0) > 7 * 86400000) { duelOubli(); return; }
  try {
    const etat = await api('duel/' + d.code);
    repriseDuel = { code: d.code, cle: d.cle || null, p1: etat.p1, p2: etat.p2, total: etat.total, invite: etat.invite || null };
    // Auto-rattachement : la clé prouve qui a créé ce duel. Connecté, on le
    // relie au compte (une seule fois) — il rejoint alors « Tes duels » sur
    // TOUS les appareils, même s'il est né avant ce rattachement.
    if (connecte() && d.cle && !d.adopte) {
      try {
        await api('duel/' + d.code + '/adopter', { cle: d.cle });
        duelEcrire({ ...d, adopte: true });
        amisLigne = null; amisErreur = null;   // les listes se rechargeront à jour
      } catch (e2) { /* hors-ligne, clé refusée… on retentera à la prochaine visite */ }
    }
    render();
  } catch (e) { if (e && e.status === 404) duelOubli(); }  // duel expiré
}

async function verifierRepriseAnim() {
  const a = animLire();
  if (!a || !a.code || !a.cle) return;
  if (Date.now() - (a.ts || 0) > 86400000) { animOubli(); return; } // >24 h : le ménage serveur est passé
  try {
    const etat = await api('veillee/' + a.code + '/etat?cle=' + a.cle);
    if (etat && etat.phase && etat.phase !== 'fin') { repriseAnim = { code: a.code, cle: a.cle }; if (ecran === 'vmenu') render(); }
    else animOubli();
  } catch (e) { if (e && e.status === 404) animOubli(); } // veillée disparue : on oublie
}

/* Animer avec la banque de MON ÉGLISE : ?eglise=GRP-XXXXX (responsable
   connecté seulement — le serveur revérifie). Seul le fetch de la banque
   change ; tirage, défis et veillées restent exactement les mêmes. */
const EGLISE = (() => {
  // L'URL d'abord (le lien « Animer dans mon église » l'y met), puis le code
  // retenu par l'application : un membre qui arrive par l'accueil doit voir
  // les séries de sa communauté sans avoir de lien spécial à suivre.
  const url = (new URLSearchParams(location.search).get('eglise') || '').toUpperCase();
  if (/^GRP-[A-Z0-9]{5}$/.test(url)) return url;
  let garde = '';
  try { garde = (localStorage.getItem('graine.eglise.code') || '').toUpperCase(); } catch (e) {}
  return /^GRP-[A-Z0-9]{5}$/.test(garde) ? garde : null;
})();
let egliseActive = false; // la banque servie est bien celle de l'église
let SERIES = null;        // séries publiées de mon église (null = pas encore demandé)
let EGLISE_NOM = '';      // son nom — on appartient parfois à deux assemblées
let serieChoisie = null;  // la série avec laquelle on joue, ou null = banque complète
const SERIES_JOUEES = 'graine.series.jouees';
function serieJouees() {
  try { return JSON.parse(localStorage.getItem(SERIES_JOUEES) || '{}') || {}; } catch (e) { return {}; }
}
function serieMarquerJouee(id) {
  try {
    const v = serieJouees();
    v['ecritoupas:' + id] = 1;
    localStorage.setItem(SERIES_JOUEES, JSON.stringify(v));
  } catch (e) { /* stockage plein ou refusé : on s'en passe */ }
}
function serieDejaJouee(id) { return !!serieJouees()['ecritoupas:' + id]; }
async function chargerSeries() {
  if (SERIES !== null || !EGLISE || !window.GraineAPI || !GraineAPI.isLoggedIn()) return;
  SERIES = [];
  try {
    const d = await GraineAPI.groupeSeries(EGLISE, 'ecritoupas');
    SERIES = ((d && d.series) || []).filter(x => x.etat === 'publiee');
    EGLISE_NOM = (d && d.eglise) || '';
  } catch (e) { /* pas membre, hors-ligne : on jouera la banque commune */ }
  render();
}
if (EGLISE) {
  // Chargée tout de suite : l'accueil dit d'où viennent les questions.
  chargerBanque().then(() => { if (ecran === 'accueil') render(); }).catch(() => {});
}

/* Arrivée directe sur le grand écran : ?direct=EV-XXXXX. */
const direct = new URLSearchParams(location.search).get('direct');
if (direct && /^EV-[A-Z2-9]{5}$/.test(direct.toUpperCase())) {
  online = { code: direct.toUpperCase(), projection: true, etat: null };
  ecran = 'proj';
  pollDemarre();
}
render();
chargerSeries();   // les séries publiées de mon église, s'il y en a
verifierRepriseDuel();  // et le défi qu'on a lancé, s'il en reste un
if (!online) verifierRepriseAnim(); // pas de projection en cours : propose la reprise si besoin
</script>
</body>
</html>
