<script>
  /* Anti-flash : applique le thème choisi AVANT le rendu — même mécanique
     que les autres modules. */
  (function () {
    try {
      var choix = localStorage.getItem('graine.theme');
      if (choix === 'clair' || choix === 'sombre' || choix === 'sepia') {
        document.documentElement.setAttribute('data-theme', choix);
      }
      var fonds = { clair: '#f7f3ea', sombre: '#141b28', sepia: '#f2e6cf' };
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var maj = function () {
        var t = document.documentElement.getAttribute('data-theme') || (mq.matches ? 'sombre' : 'clair');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', fonds[t] || fonds.clair);
      };
      maj();
      if (mq.addEventListener) mq.addEventListener('change', maj);
    } catch (e) { /* stockage indisponible : on suit le système */ }
  })();

<!-- Banque d'église (?eglise=GRP-XXXXX) ajoutée À LA MAIN dans les trois
     pages : le gabarit gen-epreuve.py, absent du dépôt, ne la connaît pas —
     à reporter dedans si la page est réengendrée un jour. -->
<script src="../visite.js" defer></script>
<script>
'use strict';
if (!window.icon) window.icon = function () { return ''; };

const TITRE = "De qui parle-t-on ?";
const PORTRAITS_PAR_SEANCE = 6;
const NB_INDICES = 5;

/* ---------- Aides ---------- */
const el = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
/* Correspondance tolérante — la MÊME règle que le serveur (portrait_norm). */
function norm(s) {
  return String(s).toLowerCase().trim()
    .replace(/œ/g, 'oe').replace(/æ/g, 'ae')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[’'-]/g, ' ')
    .replace(/[^a-z0-9 ]/g, '')
    .replace(/\s+/g, ' ').trim();
}
/* Distance de Levenshtein bornée à 1 : si l'écart de longueur dépasse déjà 1,
   réponse directe sans calcul — on ne cherche jamais plus loin qu'une faute. */
function portraitProche(a, b) {
  if (Math.abs(a.length - b.length) > 1) return false;
  if (a === b) return true;
  let prev = [];
  for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length] <= 1;
}
/* La saisie vaut-elle le portrait idx du paquet ? Une faute de frappe est
   tolérée, JAMAIS une confusion : la saisie est bonne si, après normalisation,
     1. elle est exactement dans `accepte` (comportement historique) ; OU
     2. elle est à distance de Levenshtein ≤ 1 d'une entrée `accepte` d'au
        moins 5 caractères (les cibles courtes — Paul, Saül, Élie, Sara… —
        restent en correspondance exacte), ET elle n'est à distance ≤ 1
        d'aucune entrée `accepte` d'un AUTRE portrait du paquet (si c'est
        ambigu, on refuse — on ne devine jamais).
   MÊME RÈGLE que portrait_correspond() côté serveur (api/portrait.php) :
   toute retouche ici doit y être reportée à l'identique. */
function portraitCorrespond(texte, items, idx) {
  const n = norm(texte);
  const accepte = items[idx].accepte;
  if (accepte.includes(n)) return true;
  // Garde-fou miroir du serveur : hors de [a-z0-9 ], exacte seulement.
  if (n === '' || /[^a-z0-9 ]/.test(n)) return false;
  if (!accepte.some(a => a.length >= 5 && portraitProche(n, a))) return false;
  for (let i = 0; i < items.length; i++) {
    if (i !== idx && items[i].accepte.some(a => portraitProche(n, a))) return false; // ambigu
  }
  return true;
}

/* La banque, chargée une fois. Même mécanique que le Défi : la copie
   mémorisée sur l'appareil d'abord, le serveur consulté en arrière-plan
   pour la PROCHAINE ouverture, et le fichier embarqué (pré-caché) en
   dernier filet — hors-ligne compris. */
let BANQUE = null;
const BANQUE_KEY = 'graine.portrait.banque.v1'; // copie locale de la banque vivante
function adapter(brut) {
  return (brut.items || []).map(it => ({
    reponse: it.reponse,
    accepte: [norm(it.reponse)].concat((it.accepte || []).map(norm)),
    indices: it.indices, ref: it.reference || null, genre: it.genre || 'personnage',
  }));
}
function lireBanqueLocale() { try { return JSON.parse(localStorage.getItem(BANQUE_KEY) || 'null'); } catch (e) { return null; } }
function ecrireBanqueLocale(d) { try { localStorage.setItem(BANQUE_KEY, JSON.stringify(d)); } catch (e) {} }
async function telechargerBanque() {
  // La banque « vivante » du serveur (elle inclut les retouches de
  // l'administration). La page vit dans /portrait/, l'API à la racine : ../api.
  try {
    const r = await fetch('../api/banque/portrait', { cache: 'no-cache' });
    if (r.ok) {
      const d = await r.json();
      if (d && Array.isArray(d.items) && d.items.length > 0) return d;
    }
  } catch (e) { /* pas de réseau : la copie locale ou le fichier suffira */ }
  return null;
}
async function chargerBanque() {
  if (BANQUE) return BANQUE;
  // La banque de MON ÉGLISE passe d'abord (?eglise=GRP-XXXXX, responsable
  // connecté — le serveur revérifie, 403 sinon). Jamais de copie locale pour
  // elle : elle change au gré du responsable ; inaccessible ou trop maigre
  // (moins de 3 items), la banque commune reprend la main et l'accueil dit
  // d'où l'on tire.
  // Une SÉRIE choisie par le joueur prend le relais de la banque commune —
  // et seulement si elle est choisie. Par défaut, on joue le fonds commun :
  // les questions d'une église s'ajoutent au choix, elles ne le remplacent pas.
  if (serieChoisie && EGLISE && window.GraineAPI && GraineAPI.isLoggedIn()) {
    try {
      const d = await GraineAPI.groupeSerieItems(EGLISE, 'portrait', serieChoisie);
      if (d && Array.isArray(d.items) && d.items.length > 0) {
        egliseActive = true;
        serieMarquerJouee(serieChoisie);   // ✓ dans la liste, la prochaine fois
        BANQUE = adapter(d);
        return BANQUE;
      }
    } catch (e) { /* série retirée, hors-ligne : la banque commune reprend */ }
    serieChoisie = null;   // la série a disparu : on ne bloque pas le joueur
  }
  const locale = lireBanqueLocale();
  if (locale && Array.isArray(locale.items) && locale.items.length > 0) {
    // Copie locale : on la sert tout de suite, et on rafraîchit derrière —
    // jamais en pleine séance, le tirage ne change pas sous les pieds.
    BANQUE = adapter(locale);
    telechargerBanque().then(d => { if (d) ecrireBanqueLocale(d); }).catch(() => {});
    return BANQUE;
  }
  // Première visite (ou copie absente) : le serveur, sinon le fichier
  // embarqué (et pré-caché) du module — repli silencieux.
  let d = await telechargerBanque();
  if (d) ecrireBanqueLocale(d);
  else {
    const r = await fetch('data/banque.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error("La banque de l'épreuve n'a pas pu être chargée.");
    d = await r.json();
  }
  BANQUE = adapter(d);
  return BANQUE;
}
const tirage = n => shuffle(BANQUE).slice(0, n);
function bienDit(genre) {
  return genre === 'lieu' ? 'Ce lieu est' : genre === 'chose' ? "C'est" : 'Ce personnage est';
}

/* ---------- État ---------- */
let ecran = 'accueil';
let seance = null;   // { items, idx, k, phase:'devine'|'revele', gagne, score,
                     //   participants|null, tour, enLigne|null, envoye, texte }
let config = { noms: ['', ''] };
let online = null;
let saisie = { pseudo: '', code: '' };
let repriseAnim = null; // veillée animée retrouvée au chargement : { code, cle }

/* Reprise d'animation : la clé de l'animateur ne vit plus seulement dans
   l'onglet — on la garde sur l'appareil pour qu'un rechargement (ou une mise
   en veille du téléphone) ne fige plus la veillée pour toute la salle. */
const ANIM_KEY = 'graine.portrait.anim.v1';
function animEcrire(o) { try { localStorage.setItem(ANIM_KEY, JSON.stringify(o)); } catch (e) {} }
function animLire() { try { return JSON.parse(localStorage.getItem(ANIM_KEY) || 'null'); } catch (e) { return null; } }
function animOubli() { try { localStorage.removeItem(ANIM_KEY); } catch (e) {} }

/* Le duel qu'on a LANCÉ. Sans cette mémoire, fermer l'onglet perdait le code
   pour toujours : le duel vivait sept jours sur le serveur, l'ami pouvait y
   répondre, et son score restait à jamais invisible. */
const DUEL_KEY = 'graine.portrait.duel.v1';
function duelEcrire(o) { try { localStorage.setItem(DUEL_KEY, JSON.stringify(o)); } catch (e) {} }
function duelLire() { try { return JSON.parse(localStorage.getItem(DUEL_KEY) || 'null'); } catch (e) { return null; } }
function duelOubli() { try { localStorage.removeItem(DUEL_KEY); } catch (e) {} }
let repriseDuel = null;   // { code, p1, p2, total, invite } une fois relu du serveur

/* ---------- Défier un AMI (compte facultatif) ----------
   Connecté, la liste d'amis remplace l'échange de code : un geste pour
   défier, et le défi attend l'ami dans SON écran « Défier un ami » — comme
   les duels du « Qui, où, quand ? ». Sans compte, rien ne change : le code
   à partager reste la porte ouverte à tous. */
let amisLigne = null;    // { amis, defis } une fois chargés du serveur
let amisErreur = null;   // message doux si le chargement a échoué
function connecte() { return !!(window.GraineAPI && GraineAPI.isLoggedIn()); }
function monPseudo() {
  const u = connecte() ? GraineAPI.user() : null;
  return u && u.pseudo ? String(u.pseudo).slice(0, 20) : 'Moi';
}
/* Les défis reçus POUR CETTE ÉPREUVE : l'API les rend toutes épreuves
   confondues, le préfixe du code et le mode font le tri. */
function defisRecus() {
  if (!amisLigne) return [];
  return (amisLigne.defis || []).filter(d => d.code.indexOf('PD-') === 0 && d.mode === TITRE);
}
/* MES duels pour cette épreuve — lancés ou relevés, en attente ou finis :
   la même mémoire que le « Qui, où, quand ? », sur tous mes appareils. */
function duelsDuJeu() {
  if (!amisLigne) return [];
  return (amisLigne.duels || []).filter(d => d.code.indexOf('PD-') === 0 && d.mode === TITRE);
}
async function chargerAmis(force) {
  if (!connecte()) return;
  if ((amisLigne || amisErreur) && !force) return;
  try {
    const [amis, rep] = await Promise.all([GraineAPI.friends(), GraineAPI.epreuveDefis()]);
    // Tolère l'ancienne forme (un simple tableau de défis) : pendant une mise
    // à jour, le service worker peut servir un api-client.js d'une version et
    // cette page d'une autre — mieux vaut des listes justes que rien du tout.
    const defis = Array.isArray(rep) ? rep : (rep && rep.defis) || [];
    const duels = Array.isArray(rep) ? [] : (rep && rep.duels) || [];
    amisLigne = { amis: amis, defis: defis, duels: duels };
    amisErreur = null;
  } catch (e) {
    amisLigne = null;
    amisErreur = (e && e.offline) ? 'Pas de connexion pour l\'instant — le défi par code reste possible.'
      : (e && e.message) || 'Un petit souci est survenu. Réessaie dans un instant.';
  }
  if (ecran === 'dmenu' || ecran === 'accueil') render();
}
/* Le badge de l'accueil : « un défi t'attend », discret et silencieux hors-ligne. */
function majBadgeDefis() {
  const n = defisRecus().length;
  const span = document.getElementById('defi-attente');
  if (span) span.innerHTML = n ? ` <b style="color:var(--accent)">${n === 1 ? 'Un défi t\'attend' : n + ' défis t\'attendent'}</b>` : '';
}
/* La part « entre amis » du menu de défi : les défis reçus, puis la liste
   d'amis — ou, sans compte, une invitation douce à en créer un. */
function amisHTML() {
  if (!connecte()) {
    return `<div class="card" style="margin:0 0 12px;padding:12px 16px">
      <p class="muted" style="margin:0;font-size:.85rem">Avec un compte (gratuit — écran <b>Moi</b> de l'accueil), tes amis apparaissent ici : un geste pour défier, sans code à échanger.</p>
    </div>`;
  }
  const recus = defisRecus().map(d => `
    <button class="card hub-card" data-defirecu="${esc(d.code)}" style="border:1px solid var(--accent)">
      <span class="hub-ic">${icon('epees', 26)}</span>

        <span class="hub-sub">Les mêmes portraits pour vous deux — à toi de jouer.</span></span>

  } else if (!amisLigne) {
    amis = `<div class="card" style="margin:0 0 12px"><p class="muted" style="margin:0">Tes amis arrivent…</p></div>`;
  } else if (!amisLigne.amis.length) {
    amis = `<div class="card" style="margin:0 0 12px"><p class="muted" style="margin:0">Pas encore d'amis par ici — ajoute-les dans l'écran <b>Moi</b> de l'accueil, avec leur code ami.</p></div>`;
  } else {
    amis = `<div class="card" style="margin:0 0 12px;padding:12px 16px">
      <p class="mode-title" style="margin-top:0">Défier un ami directement</p>
      <p class="muted" style="margin:0 0 6px;font-size:.82rem">Un geste suffit : le défi l'attendra dans son écran « Défier un ami ».</p>
      ${amisLigne.amis.map(a => `
        <button class="frow" data-defiami="${esc(a.friendCode)}" style="width:100%;border:0;background:none;font:inherit;color:inherit;cursor:pointer;text-align:left">
          <span>${esc(a.pseudo)}</span><b style="color:var(--accent)">Défier ›</b>
        </button>`).join('')}

  }

    const ligne = d => {
      const droite = d.status === 'attente' ? 'En attente'
        : `${d.monScore === null ? '–' : d.monScore} / ${d.sonScore === null ? '–' : d.sonScore}`;
      const gauche = d.avec ? esc(d.avec) : 'Par code · ' + esc(d.code);
      return `<button class="frow" data-duelvoir="${esc(d.code)}" data-avec="${esc(d.avec || '')}" style="width:100%;border:0;background:none;font:inherit;color:inherit;cursor:pointer;text-align:left">
          <span>⚔️ ${gauche}</span><b>${droite}</b>
        </button>`;
    };
    duels = `<div class="card" style="margin:0 0 12px;padding:12px 16px">
      <p class="mode-title" style="margin-top:0">Tes duels</p>
      ${miens.map(ligne).join('')}
    </div>`;
  }
  return recus + amis + duels;
}
let minuterie = null;

/* ---------- Séance (solo, tablée, défi) ---------- */
function demarrer(noms, enLigne, itemsServis) {
  const n = noms ? noms.length : 0;
  const parTete = noms ? Math.max(2, Math.min(3, Math.floor(BANQUE.length / n))) : 0;
  const items = itemsServis || tirage(noms ? parTete * n : PORTRAITS_PAR_SEANCE);
  seance = {
    items: items, idx: 0, k: 1, phase: 'devine', gagne: 0, texte: '',
    score: 0, total: items.length,
    participants: noms ? noms.map(nom => ({ nom: nom, score: 0 })) : null, tour: 0,
    enLigne: enLigne || null, envoye: false,
  };
  ecran = 'seance';
  render();
}
function indiceSuivant() {
  const s = seance;
  if (s.phase !== 'devine' || s.k >= NB_INDICES) return;
  s.k++;
  render();
}
function repondre() {
  const s = seance;
  if (s.phase !== 'devine' || s.texte.trim() === '') return;
  const bon = portraitCorrespond(s.texte, s.items, s.idx);
  s.gagne = bon ? (NB_INDICES + 1 - s.k) : 0;
  if (s.participants) s.participants[s.tour].score += s.gagne; else s.score += s.gagne;
  s.phase = 'revele';
  render();
}
function suivante() {
  const s = seance;
  s.idx++;
  s.k = 1; s.phase = 'devine'; s.texte = ''; s.gagne = 0;
  if (s.participants) s.tour = (s.tour + 1) % s.participants.length;
  if (s.idx >= s.items.length) ecran = 'fin';
  render();
}
function quitter() { seance = null; online = null; pollArret(); ecran = 'accueil'; render(); }

function vueSeance() {
  const s = seance;
  const item = s.items[s.idx];
  const revele = s.phase === 'revele';
  const tablee = s.participants
    ? `<div class="pchips">${s.participants.map((p, i) =>
        `<span class="pchip ${i === s.tour ? 'on' : ''}">${esc(p.nom)} · ${p.score}</span>`).join('')}</div>`
    : '';
  const lbl = s.participants
    ? `Au tour de ${esc(s.participants[s.tour].nom)} — portrait ${s.idx + 1} / ${s.total}`
    : `Portrait ${s.idx + 1} / ${s.total}`;
  let corps;
  if (!revele) {
    corps = `
      ${htmlIndices(item.indices, s.k)}
      <p class="enjeu">Répondre maintenant : <b>${NB_INDICES + 1 - s.k} point${NB_INDICES + 1 - s.k > 1 ? 's' : ''}</b></p>
      <form data-repform="1">

        </div>

  } else {
    corps = `
      ${htmlIndices(item.indices, NB_INDICES)}

        : `${bienDit(item.genre)} <b>${esc(item.reponse)}</b> — tu le retiendras 🙂`}</p>
      ${item.ref ? `<p class="refline">${esc(item.ref)} · Segond 1910</p>` : ''}

  }
  return `<div class="fade">
    <div class="topline"><span>${TITRE}${s.participants ? '' : ' · <b>' + s.score + '</b> pt' + (s.score > 1 ? 's' : '')}</span>

    ${tablee}
    <div class="card">
      <p class="muted" style="text-align:center;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px">${lbl}</p>
      ${corps}

}

function envoyerScoreDuel() {
  const s = seance;
  s.envoye = true;
  const corps = s.enLigne.cle
    ? { score: s.score, cle: s.enLigne.cle }
    : { score: s.score, pseudo: s.enLigne.pseudo };
  api('duel/' + s.enLigne.code + '/score', corps)
    .then(r => { online = { code: s.enLigne.code, resultat: r, erreur: null, avec: s.enLigne.avec || null }; ecran = 'dres'; render(); })
    .catch(e => { online = { code: s.enLigne.code, resultat: null, erreur: e.message }; ecran = 'dres'; render(); });
}

function vueFin() {
  const s = seance;
  if (s.enLigne) {
    if (!s.envoye) envoyerScoreDuel();
    return `<div class="card fin fade"><div class="score">${s.score} pts</div>
      <p class="muted" style="margin:10px 0 0">On envoie ton score…</p></div>`;
  }
  if (s.participants) {
    const cls = s.participants.slice().sort((a, b) => b.score - a.score);
    const top = cls[0].score;
    const gagnants = cls.filter(p => p.score === top);
    const mot = gagnants.length > 1 ? 'Ex æquo en tête — une prochaine fois les départagera 🙂'
      : `${esc(gagnants[0].nom)} a l'œil 🏅`;
    return `<div class="card fin fade">
      <p style="margin:0 0 12px;font-weight:650">${mot}</p>
      ${cls.map((p, i) => `<div class="frow ${p.score === top ? 'tete' : ''}"><span>${i + 1}. ${esc(p.nom)}</span><b>${p.score} pt${p.score > 1 ? 's' : ''}</b></div>`).join('')}
      <button class="btn btn-primary" data-encore="1">Rejouer la tablée</button>
      <button class="btn btn-ghost" data-quit="1">Revenir à l'accueil</button>
    </div>`;
  }
  const max = s.total * NB_INDICES;
  const mot = s.score >= max * 0.8 ? 'Un œil de prophète ✨' : s.score >= max * 0.4 ? 'Belle séance 🌱'
    : "Chaque portrait t'a ramené à un visage de la Bible — c'est comme ça qu'on apprend 🌱";
  return `<div class="card fin fade">
    <div class="score">${s.score} / ${max} pts</div>
    <p style="margin:14px 0 0">${mot}</p>
    <button class="btn btn-primary" data-encore="1">Refaire une séance</button>
    <button class="btn btn-ghost" data-quit="1">Changer de mode</button>
  </div>`;
}

/* ---------- À distance ---------- */
/* Les en-têtes d'un envoi d'épreuve : la session du compte (si elle existe)
   accompagne l'appel — c'est elle qui permet de défier un AMI (opponentCode)
   au lieu d'échanger un code à la main. Sans compte, rien ne change. */
function entetesApi() {
  const e = { 'Content-Type': 'application/json' };
  try {
    const s = window.GraineAPI && GraineAPI.session();
    if (s && s.token) e['Authorization'] = 'Bearer ' + s.token;
  } catch (err) { /* pas de client API : le défi par code suffit */ }
  return e;
}
async function api(chemin, corps) {
  const r = await fetch('../api/portrait/' + chemin, corps === undefined ? {}
    : { method: 'POST', headers: entetesApi(), body: JSON.stringify(corps) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(data.error || 'Le serveur a répondu ' + r.status + '.'); err.status = r.status; throw err; }
  return data;
}
/* Le paquet au format serveur (les accepte normalisés y repartent tels quels). */
/* Le défi qu'on a lancé, et sa réponse. Il n'existe pas d'écran de retour
   pour celui qui l'a lancé : la carte porte donc le résultat elle-même. */
/* La carte du dernier défi lancé, VUE DEPUIS « Défier un ami » : c'est sa
   place naturelle (l'accueil du jeu reste consacré aux manières de jouer).
   Connecté, « Tes duels » raconte déjà ce duel-là — la carte s'efface pour
   ne pas faire doublon ; elle reste le seul repère des défis par code. */
function duelMenuLanceHTML() {
  if (!repriseDuel) return '';
  if (connecte() && amisLigne && (amisLigne.duels || []).some(d => d.code === repriseDuel.code)) return '';
  return duelLanceHTML();
}
function duelLanceHTML() {
  if (!repriseDuel) return '';
  const d = repriseDuel;
  const moi = d.p1 && d.p1.score !== null ? d.p1.score : null;
  const corps = d.p2
    ? `<b>${esc(d.p2.pseudo)}</b> a répondu : <b>${d.p2.score} / ${d.total}</b>`
        + (moi !== null ? ` — toi, ${moi} / ${d.total}.` : '.')
    : d.invite
      ? `Ton défi attend <b>${esc(d.invite)}</b> — il le trouvera dans « Défier un ami ».`
      : `Personne n'a encore répondu. Le code à partager : <b>${esc(d.code)}</b>`;
  // Jamais relevé et la clé est là : on peut vraiment l'ANNULER (le code
  // meurt côté serveur, et il quitte la liste de l'ami invité). Sinon —
  // défi relevé, ou lancé avant que la clé ne soit gardée — on cache.
  const bouton = !d.p2 && d.cle
    ? `<button class="btn btn-ghost btn-block" data-duel-annule="1">Annuler ce défi</button>`
    : `<button class="btn btn-ghost btn-block" data-duel-oubli="1">Ne plus l'afficher</button>`;
  return `<div class="card fade" style="margin:-4px 0 16px">
    <p style="margin:0 0 8px">${corps}</p>
    ${bouton}
  </div>`;
}

/* Le choix de la banque, sur l'accueil. On ne le montre QUE si l'église a
   publié des séries : sans cela, ouvrir l'épreuve reste un seul geste. La
   banque complète est toujours là, en tête — une série s'ajoute au choix,
   elle ne remplace rien. */
function choixBanqueHTML() {
  if (!SERIES || !SERIES.length) return '';
  const pastille = (id, nom, jouee) =>
    `<button class="pill ${serieChoisie === id ? 'on' : ''}" data-serie="${id === null ? '' : id}">`
    + `${esc(nom)}${jouee ? ' ✓' : ''}</button>`;
  // Un contenu d'église se signale là où on le voit. Un simple courrier
  // pré-rempli suffit : pas de machinerie, mais un chemin qui existe.
  const choisie = SERIES.find(x => x.id === serieChoisie);
  const signaler = choisie
    ? `<p style="margin:8px 0 0"><a class="muted" style="font-size:.78rem"
         href="mailto:contact@biblehorizon.fr?subject=${encodeURIComponent('Signalement — série ' + choisie.id + ' (' + TITRE + ')')}&body=${encodeURIComponent('Série : ' + choisie.nom + '\nÉglise : ' + EGLISE + '\n\nCe qui pose problème :\n')}"
         >Signaler un contenu de cette série</a></p>`
    : '';
  return `<div style="margin:-4px 0 16px">
    <div class="muted" style="font-size:.82rem;margin-bottom:6px">Avec quelles questions ?${
      EGLISE_NOM ? ` <b>· ${esc(EGLISE_NOM)}</b>` : ''}</div>
    <div class="pill-row">
      ${pastille(null, 'Banque complète', false)}
      ${SERIES.map(x => pastille(x.id, x.nom, serieDejaJouee(x.id))).join('')}
    </div>
    ${signaler}
  </div>`;
}

function deckServeur(n) {
  return tirage(n).map(p => ({ reponse: p.reponse, accepte: p.accepte, indices: p.indices, ref: p.ref, genre: p.genre }));
}
/* Un paquet servi → forme de séance locale. Le genre voyage avec le paquet
   (le serveur le préserve) pour que la révélation dise « Ce lieu est bien… »
   plutôt que « Ce personnage est bien Jéricho » ; défaut prudent si absent. */
function deckLocal(deck) {
  return deck.map(p => ({ reponse: p.reponse, accepte: p.accepte.map(norm), indices: p.indices, ref: p.ref, genre: p.genre || 'personnage' }));
}

function vueDuelResultat() {
  const o = online;
  const r = o.resultat;
  let corps = '';
  if (o.erreur) corps = `<p class="feedback faux">${esc(o.erreur)}</p>`;
  else if (r) {
    const ligne = j => j ? `<div class="frow"><span>${esc(j.pseudo)}</span><b>${j.score === null ? 'pas encore terminé' : j.score + ' pts'}</b></div>` : '';
    let verdict = '';
    if (r.p1 && r.p2 && r.p1.score !== null && r.p2.score !== null) {
      verdict = r.p1.score === r.p2.score ? '<p style="font-weight:650;margin:12px 0 0">Égalité parfaite 🙂</p>'
        : `<p style="font-weight:650;margin:12px 0 0">${esc(r.p1.score > r.p2.score ? r.p1.pseudo : r.p2.pseudo)} a l'œil 🏅</p>`;
    } else if (!r.p2) {
      verdict = r.invite
        ? `<p class="muted" style="margin:12px 0 0">En attente de <b>${esc(r.invite)}</b> — le défi l'attend dans son écran « Défier un ami », pas besoin de code.</p>`
        : '<p class="muted" style="margin:12px 0 0">En attente de ton adversaire — partage-lui le code ci-dessus.</p>';
    }
    corps = ligne(r.p1) + ligne(r.p2) + verdict;
  } else corps = '<p class="muted">Un instant…</p>';
  // Un duel visé sur un AMI n'a pas besoin de code : l'en-tête le nomme,
  // tout simplement. Le code (et son bouton Copier) ne s'affichent que pour
  // un défi par code — là, c'est la seule façon d'inviter.
  const invite = o.avec || (r && r.invite);
  const entete = invite
    ? `<p style="font-weight:650;font-size:1.1rem;margin:0 0 8px">⚔️ Ton duel avec ${esc(invite)}</p>`
    : `<p class="muted" style="margin:0 0 4px">Le code du défi — à partager tel quel :</p>
      <div class="code-big">${esc(o.code)}</div>
      <button class="btn btn-ghost" data-copie="${esc(o.code)}">Copier le code</button>`;
  return `<div class="fade">
    <button class="quit" data-quit="1">‹ Accueil</button>
    <div class="card fin">
      ${entete}
      ${corps}
    </div>
  </div>`;
}

function vueAnim() {

  if (!e) return `<div class="card" style="padding:30px;text-align:center"><p class="muted" style="margin:0">Un instant…</p></div>`;
  const repondu = e.participants.filter(p => p.aRepondu).length;
  let controle = '';
  if (e.phase === 'attente') {
    controle = `<p class="muted">${e.participants.length} participant${e.participants.length > 1 ? 's' : ''} dans la salle.</p>
      <button class="btn btn-grow" data-avancer="lancer" ${e.participants.length === 0 ? 'disabled' : ''}>Lancer le premier portrait</button>`;
  } else if (e.phase === 'portrait') {
    controle = `<p class="muted">${repondu} / ${e.participants.length} ont verrouillé leur réponse.</p>
      <div class="choix-row">
        <button class="btn btn-ghost" data-avancer="indice" ${e.enCours.indice >= e.enCours.nbIndices ? 'disabled' : ''}>Indice suivant</button>
        <button class="btn btn-grow" data-avancer="reveler">Révéler</button>
      </div>`;

    controle = `<button class="btn btn-grow" data-avancer="suivant">${e.carte >= e.total ? 'Terminer la veillée' : 'Portrait suivant'}</button>`;
  }
  const carte = e.enCours && e.phase !== 'fin'
    ? `<div class="card"><p class="muted" style="text-align:center;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px">Portrait ${e.carte} / ${e.total} · indice ${e.enCours.indice} / ${e.enCours.nbIndices}</p>
        ${htmlIndices(e.enCours.indices, e.enCours.indices.length)}
        ${e.phase === 'revele' ? `<p class="verdict ok">C'était <b>${esc(e.enCours.reponse)}</b></p>
          ${e.enCours.ref ? `<p class="refline">${esc(e.enCours.ref)} · Segond 1910</p>` : ''}` : ''}</div>`
    : '';
  const participants = e.participants.length
    ? `<div class="pchips">${e.participants.map(p =>
        `<span class="pchip ${p.bon === true ? 'on' : ''}${p.bon === false ? ' faux' : ''}">${esc(p.prenom)} · ${p.score}${e.phase === 'portrait' && p.aRepondu ? ' 🔒' : ''}${p.bon === true ? ' +' + p.points : ''}${p.bon === false ? ' ✗' : ''}</span>`).join('')}</div>`
    : '';
  const fin = e.phase === 'fin'
    ? `<div class="card fin"><p style="font-weight:650;margin:0 0 8px">La veillée est terminée 🌱</p>
        ${e.participants.map((p, i) => `<div class="frow ${i === 0 ? 'tete' : ''}"><span>${i + 1}. ${esc(p.prenom)}</span><b>${p.score} pt${p.score > 1 ? 's' : ''}</b></div>`).join('')}</div>`
    : '';
  const lienProj = location.origin + location.pathname + '?direct=' + o.code;
  return `<div class="fade">
    <div class="topline"><span>Veillée · ${TITRE}</span><button class="quit" data-quit="1">Fermer</button></div>
    <div class="card" style="text-align:center">
      <p class="muted" style="margin:0 0 4px">Le code de la salle :</p>
      <div class="code-big">${esc(o.code)}</div>
      <button class="btn btn-ghost" data-copie="${esc(o.code)}">Copier le code</button>
      ${controle}
      <p class="muted" style="font-size:.85rem;margin:14px 2px 0">Grand écran : sur l'ordinateur relié au projecteur, ouvre cette adresse.</p>
      <div style="font-size:.82rem;overflow-wrap:anywhere;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px"><code>${esc(lienProj)}</code></div>

      <p class="verdict ${moi.bon ? 'ok' : 'faux'}">${moi.bon

  }
  return `<div class="fade">
    <div class="topline"><span>Veillée · ${TITRE} · <b>${moi.score}</b> pt${moi.score > 1 ? 's' : ''}</span>

function vueProj() {

  const indicesProj = inds => `<div class="proj-indices">${inds.map((ind, i) =>

      <p class="proj-etat" style="color:var(--ink-soft)">${e.participants.length === 0 ? 'La salle est ouverte — à vos téléphones !' : e.participants.length + ' déjà là — on attend les retardataires…'}</p>

    return `<div class="fade">

    </div>

/* ---------- L'interrogation régulière ---------- */
function pollArret() { if (minuterie) { clearInterval(minuterie); minuterie = null; } }
function pollDemarre() {
  pollArret();
  minuterie = setInterval(async () => {
    try {
      if (ecran === 'dres' && online && !online.erreur) {
        const r = await api('duel/' + online.code);
        if (JSON.stringify(r) !== JSON.stringify(online.resultat)) { online.resultat = r; render(); }
        if (r.p1 && r.p2 && r.p1.score !== null && r.p2.score !== null) pollArret();
      } else if ((ecran === 'anim' || ecran === 'part' || ecran === 'proj') && online) {
        const vAvant = online.v || 0;
        const q = ecran === 'anim' ? 'cle=' + online.cle : ecran === 'part' ? 'jeton=' + online.jeton : '';
        const e = await api('veillee/' + online.code + '/etat' + (q ? '?' + q : ''));
        if (online && (online.v || 0) === vAvant
            && JSON.stringify(e) !== JSON.stringify(online.etat)) { online.etat = e; render(); }
        if (online && online.cle && e && e.phase === 'fin') animOubli(); // veillée finie : plus rien à reprendre
      } else {
        pollArret();
      }
    } catch (err) {
      // 404 : la veillée n'existe plus (expirée, ou ménage passé) — on prévient
      // au lieu de laisser l'écran figé. Tout autre raté : on retentera.
      if (err && err.status === 404 && (ecran === 'anim' || ecran === 'part' || ecran === 'proj')) {
        pollArret();
        el.innerHTML = `<div class="fade" style="text-align:center;padding:48px 22px">`
          + `<p style="font-size:1.15rem;margin:0 0 6px">Cette veillée n'existe plus.</p>`
          + `<p class="muted" style="margin:0 0 22px">Elle a peut-être expiré — une veillée ne vit qu'un temps.</p>`
          + `<button class="btn btn-primary" data-perdu="1">Revenir au début</button></div>`;
        const b = el.querySelector('[data-perdu]');
        if (b) b.onclick = () => { location.href = './'; };
      }
    }
  }, 2500);
}

/* ---------- Rendu & câblage ---------- */
function render() {
  el.classList.toggle('proj', ecran === 'proj');
  el.innerHTML = ecran === 'seance' ? vueSeance() : ecran === 'fin' ? vueFin()
    : ecran === 'config' ? vueConfig()
    : ecran === 'dmenu' ? vueDuelMenu() : ecran === 'vmenu' ? vueVeilleeMenu()
    : ecran === 'dcfg' ? vueDuelConfig() : ecran === 'djoin' ? vueJoin(false)
    : ecran === 'vjoin' ? vueJoin(true) : ecran === 'vproj' ? vueProjection()
    : ecran === 'dres' ? vueDuelResultat() : ecran === 'vcfg' ? vueVeilleeConfig()
    : ecran === 'anim' ? vueAnim() : ecran === 'part' ? vuePart()
    : ecran === 'proj' ? vueProj()
    : vueAccueil();

  const q1 = el.querySelector.bind(el);
  const versEcran = e => () => { ecran = e; render(); };
  const erreurLigne = msg => { const n = q1('#err-ligne'); if (n) n.textContent = msg; };
  const avecBanque = fn => async (ev) => {
    const b = ev.currentTarget;
    b.disabled = true;
    try { await chargerBanque(); fn(); }
    catch (e) { b.disabled = false; alert("La banque de l'épreuve n'a pas pu être chargée — vérifie ta connexion."); }
  };

  if (q1('[data-retour-defi]')) q1('[data-retour-defi]').addEventListener('click', () => { location.href = '../defi/'; });
  if (q1('[data-reprise]')) q1('[data-reprise]').addEventListener('click', async () => {
    if (!repriseAnim) return;
    online = { code: repriseAnim.code, cle: repriseAnim.cle, etat: null };
    ecran = 'anim'; render();
    try { online.etat = await api('veillee/' + online.code + '/etat?cle=' + online.cle); render(); } catch (e) {}
    pollDemarre();
  });
  if (q1('[data-duel-oubli]')) q1('[data-duel-oubli]').addEventListener('click', () => {
    duelOubli(); repriseDuel = null; render();
  });
  if (q1('[data-duel-annule]')) q1('[data-duel-annule]').addEventListener('click', async (ev) => {
    ev.currentTarget.disabled = true;
    try { await api('duel/' + repriseDuel.code + '/annuler', { cle: repriseDuel.cle }); }
    catch (e) { /* déjà balayé ou relevé entre-temps : la carte s'efface, le serveur a le dernier mot */ }
    duelOubli(); repriseDuel = null; render();
  });
  el.querySelectorAll('[data-serie]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.serie;
    serieChoisie = v === '' ? null : Number(v);
    BANQUE = null;
    egliseActive = false;
    render();
  }));
  if (q1('[data-solo]')) q1('[data-solo]').addEventListener('click', avecBanque(() => demarrer(null, null, null)));
  if (q1('[data-multi]')) q1('[data-multi]').addEventListener('click', versEcran('config'));
  // sous-menus et retours : la carte (ou le lien) porte l'écran où elle mène
  el.querySelectorAll('[data-vers]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.vers === 'dmenu') { amisLigne = null; amisErreur = null; } // duels toujours frais
    versEcran(b.dataset.vers)();
  }));
  if (q1('[data-quit]')) q1('[data-quit]').addEventListener('click', quitter);

  if (q1('[data-indice]')) q1('[data-indice]').addEventListener('click', indiceSuivant);
  const repform = q1('[data-repform]');
  if (repform) repform.addEventListener('submit', e => { e.preventDefault(); repondre(); });
  const inTexte = q1('#in-texte');
  if (inTexte) {
    inTexte.addEventListener('input', () => {
      if (ecran === 'seance') seance.texte = inTexte.value; else saisie.texte = inTexte.value;
    });
    if (ecran === 'seance' || (ecran === 'part' && online && online.etat && online.etat.phase === 'portrait')) inTexte.focus();
  }
  if (q1('[data-suiv]')) q1('[data-suiv]').addEventListener('click', suivante);
  if (q1('[data-encore]')) q1('[data-encore]').addEventListener('click', () =>
    demarrer(seance.participants ? seance.participants.map(p => p.nom) : null, null, null));

  el.querySelectorAll('[data-nom]').forEach(inp => inp.addEventListener('input', () => {
    config.noms[+inp.dataset.nom] = inp.value;
  }));
  if (q1('[data-addp]')) q1('[data-addp]').addEventListener('click', () => { if (config.noms.length < 6) { config.noms.push(''); render(); } });
  if (q1('[data-delp]')) q1('[data-delp]').addEventListener('click', () => { if (config.noms.length > 2) { config.noms.pop(); render(); } });
  if (q1('[data-multistart]')) q1('[data-multistart]').addEventListener('click', avecBanque(() => {
    demarrer(config.noms.map((n, i) => n.trim() !== '' ? n.trim() : 'Participant ' + (i + 1)), null, null);
  }));

  const inPseudo = q1('#in-pseudo');
  if (inPseudo) inPseudo.addEventListener('input', () => { saisie.pseudo = inPseudo.value; });
  const inCode = q1('#in-code');
  if (inCode) inCode.addEventListener('input', () => { saisie.code = inCode.value; });

  const duelgo = q1('[data-duelgo]');
  if (duelgo) duelgo.addEventListener('click', async () => {
    const pseudo = saisie.pseudo.trim();
    if (pseudo === '') { erreurLigne('Ton prénom, pour que ton ami sache qui le défie 🙂'); return; }
    duelgo.disabled = true;
    try {
      await chargerBanque();
      const deck = deckServeur(PORTRAITS_PAR_SEANCE);
      const r = await api('duel', { pseudo: pseudo, deck: deck });
      duelEcrire({ code: r.code, cle: r.cle, ts: Date.now() });
      demarrer(null, { code: r.code, cle: r.cle }, deckLocal(deck));
    } catch (e) { duelgo.disabled = false; erreurLigne(e.message); }
  });

  // Défier un AMI en un geste : le défi part relié à son compte — il le
  // trouvera dans son écran « Défier un ami », sans code à recopier.
  el.querySelectorAll('[data-defiami]').forEach(b => b.addEventListener('click', async () => {
    el.querySelectorAll('[data-defiami]').forEach(x => { x.disabled = true; });
    try {
      await chargerBanque();
      const deck = deckServeur(PORTRAITS_PAR_SEANCE);
      const r = await api('duel', { deck: deck, opponentCode: b.dataset.defiami });
      duelEcrire({ code: r.code, cle: r.cle, ts: Date.now() });
      demarrer(null, { code: r.code, cle: r.cle }, deckLocal(deck));
    } catch (e) {
      el.querySelectorAll('[data-defiami]').forEach(x => { x.disabled = false; });
      erreurLigne(e.message);
    }
  }));
  // …et relever celui qu'un ami m'a envoyé.
  el.querySelectorAll('[data-defirecu]').forEach(b => b.addEventListener('click', async () => {
    el.querySelectorAll('[data-defirecu]').forEach(x => { x.disabled = true; });
    try {
      const code = b.dataset.defirecu;
      const r = await api('duel/' + code);
      if (r.p2) throw new Error('Ce défi a déjà trouvé son adversaire.');
      const dInfo = amisLigne && (amisLigne.defis || []).find(x => x.code === code);
      // Relevé : il quitte la liste (et le badge) sans attendre le serveur.
      if (amisLigne) amisLigne.defis = (amisLigne.defis || []).filter(x => x.code !== code);
      demarrer(null, { code: code, pseudo: monPseudo(), avec: dInfo ? dInfo.de : null }, deckLocal(r.deck));
    } catch (e) {
      el.querySelectorAll('[data-defirecu]').forEach(x => { x.disabled = false; });
      erreurLigne(e.message);
    }
  }));
  // Revoir un de MES duels — en attente ou fini : l'écran de résultat,
  // rafraîchi en direct si l'autre joue pendant qu'on regarde.
  el.querySelectorAll('[data-duelvoir]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    try {
      const code = b.dataset.duelvoir;
      const r = await api('duel/' + code);
      online = { code: code, resultat: r, erreur: null, avec: b.dataset.avec || null };
      ecran = 'dres'; render();
    } catch (e) { b.disabled = false; erreurLigne(e.message); }
  }));

  const joingo = q1('[data-joingo]');
  if (joingo) joingo.addEventListener('click', async () => {
    const code = saisie.code.trim().toUpperCase();
    const prenom = saisie.pseudo.trim();
    if (prenom === '') { erreurLigne('Ton prénom, pour le classement 🙂'); return; }
    joingo.disabled = true;
    try {
      if (code.startsWith('PD-')) {
        const r = await api('duel/' + code);
        if (r.p2) throw new Error('Ce défi a déjà trouvé son adversaire.');
        demarrer(null, { code: code, pseudo: prenom }, deckLocal(r.deck));
      } else if (code.startsWith('PV-')) {
        const r = await api('veillee/' + code + '/rejoindre', { prenom: prenom });
        online = { code: code, jeton: r.jeton, prenom: prenom, etat: null };
        ecran = 'part'; render(); pollDemarre();
      } else if (joingo.dataset.joingo === 'veillee') {
        throw new Error("Le code de la veillée s'affiche sur le grand écran : il commence par PV- (un code PD- ouvre un défi).");
      } else {
        throw new Error('Un code de défi commence par PD- (et un code PV- rejoint une veillée en direct).');
      }
    } catch (e) { joingo.disabled = false; erreurLigne(e.message); }
  });

  const projgo = q1('[data-projgo]');
  if (projgo) projgo.addEventListener('click', async () => {
    const code = saisie.code.trim().toUpperCase();
    if (!code.startsWith('PV-')) { erreurLigne('Le grand écran affiche une veillée : il faut un code PV-.'); return; }
    projgo.disabled = true;
    try {
      await api('veillee/' + code + '/etat');
      online = { code: code, projection: true, etat: null };
      ecran = 'proj'; render(); pollDemarre();
    } catch (e) { projgo.disabled = false; erreurLigne(e.message); }
  });

  const veilgo = q1('[data-veilgo]');
  if (veilgo) veilgo.addEventListener('click', async () => {
    veilgo.disabled = true;
    try {
      await chargerBanque();
      const deck = deckServeur(PORTRAITS_PAR_SEANCE);
      const r = await api('veillee', { deck: deck });
      online = { code: r.code, cle: r.cle, etat: null };
      animEcrire({ code: r.code, cle: r.cle, ts: Date.now() });
      ecran = 'anim'; render(); pollDemarre();
    } catch (e) { veilgo.disabled = false; erreurLigne(e.message); }
  });

  el.querySelectorAll('[data-avancer]').forEach(b => b.addEventListener('click', async () => {
    if (online.enVol) return;
    online.enVol = true;
    b.disabled = true;
    try {
      online.etat = await api('veillee/' + online.code + '/avancer',
        { cle: online.cle, action: b.dataset.avancer });
      online.v = (online.v || 0) + 1;
      online.enVol = false;
      render();
    } catch (e) { online.enVol = false; render(); }
  }));

  const vrepform = q1('[data-vrepform]');
  if (vrepform) vrepform.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (online.repEnVol) return; // double-tap / Entrée : une seule réponse en vol
    const texte = (saisie.texte || '').trim();
    if (texte === '') return;
    online.repEnVol = true;
    try {
      online.etat = await api('veillee/' + online.code + '/reponse',
        { jeton: online.jeton, carte: online.etat.carte, texte: texte });
      online.v = (online.v || 0) + 1;
      saisie.texte = '';
      online.repEnVol = false;
      render();
    } catch (err) { online.repEnVol = false; render(); } // formulaire frais → réessai possible
  });

  const copie = q1('[data-copie]');
  if (copie) copie.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(copie.dataset.copie); copie.textContent = 'Code copié ✓'; }
    catch (e) { copie.textContent = 'Copie impossible — note-le à la main'; }
    setTimeout(() => { copie.textContent = 'Copier le code'; }, 2400);
  });
  const copieLien = q1('[data-copie-lien]');
  if (copieLien) copieLien.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(copieLien.dataset.copieLien); copieLien.textContent = 'Adresse copiée ✓'; }
    catch (e) { copieLien.textContent = 'Copie impossible — recopie-la à la main'; }
    setTimeout(() => { copieLien.textContent = "Copier l'adresse du grand écran"; }, 2400);
  });

  if (ecran === 'dres' && online && !online.erreur && !minuterie) pollDemarre();

  // Connecté, l'accueil et le menu de défi savent qui sont tes amis et si
  // un défi t'attend (silencieux hors-ligne — tout le reste vit sans réseau).
  if (connecte() && (ecran === 'accueil' || ecran === 'dmenu')) { chargerAmis(); majBadgeDefis(); }
}

/* Au retour sur l'épreuve : où en est le défi qu'on a lancé ? Sept jours,
   c'est la durée de vie du code côté serveur — au-delà, on oublie. */
async function verifierRepriseDuel() {
  const d = duelLire();
  if (!d || !d.code) return;
  if (Date.now() - (d.ts || 0) > 7 * 86400000) { duelOubli(); return; }
  try {
    const etat = await api('duel/' + d.code);
    repriseDuel = { code: d.code, cle: d.cle || null, p1: etat.p1, p2: etat.p2, total: etat.total, invite: etat.invite || null };
    render();
  } catch (e) { if (e && e.status === 404) duelOubli(); }  // duel expiré
}

/* Une veillée animée traîne-t-elle sur cet appareil ? Si elle existe encore
   côté serveur et n'est pas finie, on propose de reprendre la main. */
async function verifierRepriseAnim() {
  const a = animLire();
  if (!a || !a.code || !a.cle) return;
  if (Date.now() - (a.ts || 0) > 86400000) { animOubli(); return; } // >24 h : le ménage serveur est passé
  try {
    const etat = await api('veillee/' + a.code + '/etat?cle=' + a.cle);
    if (etat && etat.phase && etat.phase !== 'fin') { repriseAnim = { code: a.code, cle: a.cle }; if (ecran === 'vmenu') render(); }
    else animOubli();
  } catch (e) { if (e && e.status === 404) animOubli(); } // veillée disparue : on oublie
}

/* Animer avec la banque de MON ÉGLISE : ?eglise=GRP-XXXXX (responsable
   connecté seulement — le serveur revérifie). Seul le fetch de la banque
   change ; tirage, défis et veillées restent exactement les mêmes. */
const EGLISE = (() => {
  // L'URL d'abord (le lien « Animer dans mon église » l'y met), puis le code
  // retenu par l'application : un membre qui arrive par l'accueil doit voir
  // les séries de sa communauté sans avoir de lien spécial à suivre.
  const url = (new URLSearchParams(location.search).get('eglise') || '').toUpperCase();
  if (/^GRP-[A-Z0-9]{5}$/.test(url)) return url;
  let garde = '';
  try { garde = (localStorage.getItem('graine.eglise.code') || '').toUpperCase(); } catch (e) {}
  return /^GRP-[A-Z0-9]{5}$/.test(garde) ? garde : null;
})();
let egliseActive = false; // la banque servie est bien celle de l'église
let SERIES = null;        // séries publiées de mon église (null = pas encore demandé)
let EGLISE_NOM = '';      // son nom — on appartient parfois à deux assemblées
let serieChoisie = null;  // la série avec laquelle on joue, ou null = banque complète
const SERIES_JOUEES = 'graine.series.jouees';
function serieJouees() {
  try { return JSON.parse(localStorage.getItem(SERIES_JOUEES) || '{}') || {}; } catch (e) { return {}; }
}
function serieMarquerJouee(id) {
  try {
    const v = serieJouees();
    v['portrait:' + id] = 1;
    localStorage.setItem(SERIES_JOUEES, JSON.stringify(v));
  } catch (e) { /* stockage plein ou refusé : on s'en passe */ }
}
function serieDejaJouee(id) { return !!serieJouees()['portrait:' + id]; }
async function chargerSeries() {
  if (SERIES !== null || !EGLISE || !window.GraineAPI || !GraineAPI.isLoggedIn()) return;
  SERIES = [];
  try {
    const d = await GraineAPI.groupeSeries(EGLISE, 'portrait');
    SERIES = ((d && d.series) || []).filter(x => x.etat === 'publiee');
    EGLISE_NOM = (d && d.eglise) || '';
  } catch (e) { /* pas membre, hors-ligne : on jouera la banque commune */ }
  render();
}
if (EGLISE) {
  // Chargée tout de suite : l'accueil dit d'où viennent les questions.
  chargerBanque().then(() => { if (ecran === 'accueil') render(); }).catch(() => {});
}

/* Arrivée directe sur le grand écran : ?direct=PV-XXXXX. */
const direct = new URLSearchParams(location.search).get('direct');
if (direct && /^PV-[A-Z2-9]{5}$/.test(direct.toUpperCase())) {
  online = { code: direct.toUpperCase(), projection: true, etat: null };
  ecran = 'proj';
  pollDemarre();
}
render();
chargerSeries();   // les séries publiées de mon église, s'il y en a
verifierRepriseDuel();  // et le défi qu'on a lancé, s'il en reste un
if (!online) verifierRepriseAnim(); // pas de projection en cours : propose la reprise si besoin
</script>
</body>
</html>
